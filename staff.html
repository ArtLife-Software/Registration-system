<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3349;--accent:#f97316;--accent2:#fb923c;--green:#22c55e;--red:#ef4444;--text:#e8eaf0;--muted:#9aa1b5;--mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
.wrap{max-width:560px;margin:0 auto;padding:20px;padding-bottom:90px;}
.header{text-align:center;padding:24px 0 16px;}
.header .logo{font-size:2rem;margin-bottom:4px;}
.header .title{font-size:1.2rem;font-weight:900;}
.header .sub{font-size:.78rem;color:var(--muted);margin-top:2px;}
.tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:12px;gap:4px;}
.tab{flex:1;text-align:center;padding:10px 4px;border-radius:8px;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;}
.tab.active{background:var(--accent);color:#fff;}

.input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-family:var(--sans);font-size:.92rem;outline:none;transition:border-color .2s;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:8px;border:none;font-family:var(--sans);font-size:.92rem;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:var(--accent2);}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}

.btn-full{width:100%;}

.badge-green{background:rgba(34,197,94,.1);color:var(--green);border-color:rgba(34,197,94,.3);}
.loading-cell{text-align:center;color:var(--muted);padding:30px 10px;font-size:.85rem;}

.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.success{border-left:4px solid var(--green);}
.toast.error{border-left:4px solid var(--red);}
/* ── 關於 Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:500;}

.about-divider{height:1px;background:var(--border);margin:14px 0;}
body.no-sys .tabs, body.no-sys .page{display:none!important;}
.sys-pick{display:block;padding:14px 16px;margin-top:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);text-decoration:none;font-weight:600;}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js";
import { getFirestore, collection, doc, getDoc, getDocs, updateDoc, query, orderBy, where, serverTimestamp, runTransaction, deleteField } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7a1puWKl5WYC19PUnh-Di7ra70e862I8",
  authDomain: "registration-system-6e296.firebaseapp.com",
  projectId: "registration-system-6e296",
  storageBucket: "registration-system-6e296.firebasestorage.app",
  messagingSenderId: "561912063653",
  appId: "1:561912063653:web:03fefeb99aa16885818f4c"
};
const app = initializeApp(firebaseConfig);
// App Check：跟參加者報名頁用同一組 Fraud Defense（reCAPTCHA Enterprise）網站金鑰即可，
// 換成 Firebase Console→App Check 註冊應用程式拿到的金鑰。
initializeAppCheck(app, {
  provider: new ReCaptchaEnterpriseProvider('RECAPTCHA_ENTERPRISE_SITE_KEY_PLACEHOLDER'),
  isTokenAutoRefreshEnabled: true
});
const db = getFirestore(app);
const auth = getAuth(app);
// Cloud Functions（工作人員報名/查改的伺服器端處理，部署在 asia-east1）
const functions = getFunctions(app, 'asia-east1');

// ── 報名系統（網址 ?s=系統代碼）──
// 每個系統各自獨立：自己的活動、參加者資料。這個頁面只顯示網址指定的系統。
const SYS=(new URLSearchParams(location.search).get('s')||'').trim().toLowerCase();
const SYS_RE=/^[a-z0-9][a-z0-9-]{1,29}$/;
// ── 系列（網址 &g=系列ID：只顯示這個系列的活動）──
// 活動選單依系列分組顯示；系列不存在（例如已刪除）就不篩選，顯示全部活動。
const SERIES_FILTER=(new URLSearchParams(location.search).get('g')||'').trim();
let seriesMapP=null;
function loadSeriesMap(){
  if(!seriesMapP){
    seriesMapP=getDocs(collection(db,'systems',SYS,'series')).then(snap=>{
      const m={}; snap.docs.forEach(d=>{ m[d.id]={id:d.id,...d.data()}; }); return m;
    }).catch(()=>({}));
  }
  return seriesMapP;
}
async function filterBySeries(list){
  if(!SERIES_FILTER) return list;
  const sm=await loadSeriesMap();
  if(!sm[SERIES_FILTER]) return list;
  return list.filter(ev=>ev.seriesId===SERIES_FILTER);
}
// 活動 <option>：有系列時依系列分組（系列依後台排序，同系列新的一期在前），沒系列的放「其他活動」
async function eventOptionsHtml(list, selectedId, open, close){
  open=open||'（'; close=close||'）';
  const sm=await loadSeriesMap();
  const opt=ev=>'<option value="'+esc(ev.id)+'"'+(selectedId&&ev.id===selectedId?' selected':'')+'>'+esc(ev.name+(ev.date?open+ev.date+close:''))+'</option>';
  const buckets=new Map();
  list.forEach(ev=>{ const k=(ev.seriesId&&sm[ev.seriesId])?ev.seriesId:''; if(!buckets.has(k))buckets.set(k,[]); buckets.get(k).push(ev); });
  const keys=[...buckets.keys()].filter(k=>k);
  if(!keys.length) return list.map(opt).join('');
  const ord=s=>typeof s.sortOrder==='number'?s.sortOrder:1e9;
  keys.sort((a,b)=>ord(sm[a])-ord(sm[b])||String(sm[a].name).localeCompare(String(sm[b].name),'zh-Hant'));
  let html=keys.map(k=>'<optgroup label="'+esc(sm[k].name||'')+'">'
    +buckets.get(k).slice().sort((a,b)=>(b.seriesNo||0)-(a.seriesNo||0)).map(opt).join('')+'</optgroup>').join('');
  if(buckets.has('')) html+='<optgroup label="其他活動">'+buckets.get('').map(opt).join('')+'</optgroup>';
  return html;
}
// 網址指定系列時，頁首副標題顯示系列名稱
async function applySeriesHeader(role){
  if(!SERIES_FILTER) return;
  const sm=await loadSeriesMap();
  const s=sm[SERIES_FILTER];
  if(s) document.querySelector('.header .sub').textContent=s.name+' · '+role;
}
// 呼叫後端時自動帶上系統代碼
function callFn(name){
  const fn=httpsCallable(functions,name);
  return data=>fn({...data,systemId:SYS});
}

// ── 匿名登入（使用者無感）──
// firestore.rules 要求所有讀寫至少要有登入身分；這裡在背景自動取得
// 匿名身分，工作人員不需要註冊任何帳號。
//
// ⚠️ 這裡故意不用「if(auth.currentUser) return; 否則 signInAnonymously()」
// 這種寫法：頁面剛載入時，Firebase 都還在背景非同步地從瀏覽器裡還原「先前
// 已經登入」的身分（例如同一瀏覽器另一分頁開著 admin.html 用管理員帳號
// 登入），這個還原動作還沒完成之前 auth.currentUser 會短暫是 null。
// 若直接判斷 null 就呼叫 signInAnonymously()，等於在管理員身分「正要」
// 被還原的那一瞬間硬塞進一個匿名身分，蓋掉同瀏覽器（同網域）其他分頁
// 原本的管理員登入狀態，導致 admin.html 被強制登出。
// 改用 onAuthStateChanged 等 Firebase 確定「目前到底有沒有人登入」之後，
// 沒有才補做匿名登入；已經有登入（不論是管理員或匿名）就直接沿用。
let ensureAuthPromise = null;
function ensureAuth(){
  if (!ensureAuthPromise) {
    ensureAuthPromise = new Promise((resolve, reject) => {
      const unsub = onAuthStateChanged(auth, async user => {
        unsub();
        if (user) { resolve(); return; }
        try { await signInAnonymously(auth); resolve(); }
        catch(e){ showToast('連線初始化失敗，請重新整理頁面：'+e.message,'error'); reject(e); }
      });
    });
  }
  return ensureAuthPromise;
}

// ── HTML escape（防止使用者輸入被當作HTML/JS執行）──
// ── 自訂欄位的顯示條件與區塊（admin.html／member.html／staff.html／後端各放一份，判斷邏輯必須一致）──
// 欄位可設 cond：{ src, op, val }
//   src：排在上面的某個自訂欄位 id，或 '__gender'（性別）、'__age'（年齡，以活動日期計算）
//   op：in（等於其中任一項：下拉、性別）、has（有勾其中任一項：複選）、checked／unchecked（勾選框）、
//       filled／empty（文字有填／沒填）、age（年齡介於 val.min～val.max，留空不限）
// 區塊標題（type:'section'）：到下一個區塊標題前的欄位都屬於它；區塊隱藏時，裡面的欄位全部隱藏。
// 隱藏的欄位不顯示、不驗證、不送出（跟「適用組別」一樣）；條件來源被隱藏時，依賴它的欄位也隱藏。
// ctx：{ groupId, gender, age }；values：{ 欄位id: 目前的值 }
// 單一條件是否成立。srcVisible：來源欄位是否顯示中；v：來源欄位的值
function cfCondMatch(c, ctx, srcVisible, v){
  if(!c||!c.src) return true;
  if(c.src==='__gender') return (c.val||[]).includes(ctx.gender||'');
  if(c.src==='__age'){
    const a=ctx.age; if(a===null||a===undefined||isNaN(a)) return false;
    const mn=c.val&&c.val.min, mx=c.val&&c.val.max;
    return (!(mn>0)||a>=mn)&&(!(mx>0)||a<=mx);
  }
  if(!srcVisible) return false; // 來源被隱藏、排在下面或已刪除
  switch(c.op){
    case 'in': return typeof v==='string'&&(c.val||[]).includes(v);
    case 'has': return Array.isArray(v)&&v.some(x=>(c.val||[]).includes(x));
    case 'checked': return v===true;
    case 'unchecked': return v!==true;
    case 'filled': return Array.isArray(v)?v.length>0:(typeof v==='string'?!!v.trim():!!v);
    case 'empty': return !(Array.isArray(v)?v.length>0:(typeof v==='string'?!!v.trim():!!v));
    default: return true;
  }
}
function cfGroupOk(f, ctx){ return !f.groups||!f.groups.length||f.groups.includes(ctx.groupId||''); }
// fixed：直接指定某些欄位顯示與否（多人報名的個人修改：共用欄位的顯示狀態以整批為準）
function cfVisibility(fields, values, ctx, fixed){
  const vis={}; let sec=true;
  for(const f of fields){
    if(fixed&&Object.prototype.hasOwnProperty.call(fixed,f.id)){ vis[f.id]=!!fixed[f.id]; if(f.type==='section') sec=vis[f.id]; continue; }
    const ok=cfGroupOk(f,ctx)&&cfCondMatch(f.cond,ctx,f.cond&&vis[f.cond.src],f.cond&&values[f.cond.src]);
    if(f.type==='section'){ sec=ok; vis[f.id]=sec; continue; }
    vis[f.id]=sec&&ok;
  }
  return vis;
}
// ── 多人報名 ──
// 區塊標題可設 scope:'shared'（共同填寫一次）：從它到下一個區塊標題之間都是共用欄位；
// 第一個區塊標題之前，或區塊沒設 shared＝每人各填。
function cfSharedIds(fields){
  const s=new Set(); let sh=false;
  for(const f of fields||[]){ if(f.type==='section') sh=f.scope==='shared'; if(sh) s.add(f.id); }
  return s;
}
// persons：[{ values, ctx }]（每人的欄位值與性別／年齡／組別）；shared：共用欄位的值
// 共用欄位：任一人符合就顯示；每人欄位：依各自資料判斷，條件來源是共用欄位時用共用的值。
// 回傳 { shared:{id:bool}, persons:[{id:bool}] }
function cfVisibilityMulti(fields, shared, persons){
  const sids=cfSharedIds(fields); const visS={}; let secS=true;
  const P=persons.map(()=>({vis:{}, sec:true}));
  const ok=(f,i)=>{
    const p=persons[i], c=f.cond, src=c&&c.src, isS=src&&sids.has(src);
    return cfGroupOk(f,p.ctx)&&cfCondMatch(c,p.ctx,src&&(isS?visS[src]:P[i].vis[src]),src&&(isS?shared[src]:p.values[src]));
  };
  for(const f of fields||[]){
    if(sids.has(f.id)){
      const any=persons.some((p,i)=>ok(f,i));
      if(f.type==='section'){ secS=any; visS[f.id]=any; } else visS[f.id]=secS&&any;
    } else {
      persons.forEach((p,i)=>{ const r=ok(f,i); if(f.type==='section'){ P[i].sec=r; P[i].vis[f.id]=r; } else P[i].vis[f.id]=P[i].sec&&r; });
    }
  }
  return {shared:visS, persons:P.map(x=>x.vis)};
}
// 多人報名的個人修改：共用欄位的顯示狀態以「整批存下來的資料」為準（有存值＝顯示中）
function cfFixedFromStored(fields, stored){
  const sids=cfSharedIds(fields), fixed={}; let secId=null;
  for(const f of fields||[]){
    if(!sids.has(f.id)){ secId=null; continue; }
    if(f.type==='section'){ secId=f.id; fixed[f.id]=false; continue; }
    fixed[f.id]=Object.prototype.hasOwnProperty.call(stored||{},f.id);
    if(fixed[f.id]&&secId) fixed[secId]=true;
  }
  return fixed;
}
// 表單、列表、匯出用的「有資料的欄位」（排除區塊標題）
function cfDataFields(fields){ return (fields||[]).filter(f=>f.type!=='section'); }
// 讀出表單上某個自訂欄位目前的值（判斷顯示條件用）
function cfReadRaw(id, f){
  const el=document.getElementById(id); if(!el) return undefined;
  if(f.type==='multi'){
    const vals=[...el.querySelectorAll('input[type=checkbox]:not([data-other]):checked')].map(x=>x.value);
    const oc=el.querySelector('input[data-other]');
    if(oc&&oc.checked){ const t=(document.getElementById(id+'_other')?.value||'').trim(); if(t) vals.push(t); }
    return vals;
  }
  if(f.type==='checkbox') return el.checked;
  let v=(el.value||'').trim();
  if(f.type==='select'&&f.allowOther&&v==='__other__') v=(document.getElementById(id+'_other')?.value||'').trim();
  return v;
}
// 依目前填寫內容切換欄位的顯示；回傳 vis（欄位id → 是否顯示）
function cfApplyVisibility(fields, idPrefix, rowPrefix, ctx, fixed){
  const values={};
  (fields||[]).forEach(f=>{ if(f.type!=='section') values[f.id]=cfReadRaw(idPrefix+f.id,f); });
  const vis=cfVisibility(fields||[], values, ctx, fixed);
  (fields||[]).forEach(f=>{ const row=document.getElementById(rowPrefix+f.id); if(row) row.style.display=vis[f.id]?'':'none'; });
  return vis;
}
// 表單上的年齡（以活動日期計算；生日沒填或格式不對＝null）
function cfAgeFrom(birthday, evDate){
  if(!birthday||!/^\d{4}\/\d{2}\/\d{2}$/.test(birthday)) return null;
  const [by,bm,bd]=birthday.split('/').map(Number);
  const base=evDate?new Date(String(evDate).replace(/\//g,'-')+'T00:00:00'):new Date();
  if(isNaN(base)) return null;
  let age=base.getFullYear()-by;
  if(base.getMonth()+1<bm||(base.getMonth()+1===bm&&base.getDate()<bd)) age--;
  return age>=0?age:null;
}
function cfSectionHtml(f){
  return '<div class="cf-section" style="margin:18px 0 12px;padding-top:12px;border-top:1px solid var(--border)">'
    +'<div style="font-weight:800;font-size:.95rem">'+esc(f.label)+'</div>'
    +(f.description?'<div style="font-size:.78rem;color:var(--muted);margin-top:2px">'+esc(f.description)+'</div>':'')+'</div>';
}

// 報名表單：依性別、年齡與已填內容切換自訂欄位（工作人員沒有組別）
function refreshSignupCf(){
  return cfApplyVisibility(curSignupCustomFields,'su_cf_','su_cf_row_',{groupId:'',
    gender:document.getElementById('suGender')?.value||'',
    age:cfAgeFrom(document.getElementById('suBirthday')?.value.trim(), curSignupEvent?.date||'')});
}
// 修改表單
function refreshEditCf(cardId){
  const box=document.getElementById(cardId+'_edit'); if(!box) return {};
  let fields=[]; try{fields=JSON.parse(box.dataset.customFields||'[]');}catch(e){return {};}
  let fixed=null; try{ if(box.dataset.cffixed) fixed=JSON.parse(box.dataset.cffixed); }catch(e){}

// ── 複選欄位（自訂欄位 type:'multi'）──
// 值存成字串陣列；勾「其他」時把輸入的文字也放進陣列。
// 必填＝至少選一項；最少（minSel）、最多（maxSel）留空＝不限。選填時可以都不選，有選就要符合最少／最多。
function multiRangeText(f){
  const mn=f.minSel||0, mx=f.maxSel||0;
  if(mn&&mx) return mn===mx?'請選 '+mn+' 項':'請選 '+mn+'～'+mx+' 項';
  if(mn) return '至少選 '+mn+' 項';
  if(mx) return '最多選 '+mx+' 項';
  return '可複選';
}
function multiFieldHtml(id, f, cur, reqMark, descHtml){
  cur=Array.isArray(cur)?cur:(cur?[String(cur)]:[]);
  const opts=f.options||[];
  const others=cur.filter(v=>!opts.includes(v));
  let h='<div class="input-group"><label>'+esc(f.label)+reqMark+' <span style="font-weight:400;color:var(--muted);font-size:.75rem">（'+multiRangeText(f)+'）</span></label>'
    +'<div id="'+id+'" class="cf-multi" style="display:flex;flex-wrap:wrap;gap:6px 16px;padding:4px 0">';
  opts.forEach(o=>{ h+='<label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.88rem"><input type="checkbox" value="'+esc(o)+'"'+(cur.includes(o)?' checked':'')+'> '+esc(o)+'</label>'; });
  if(f.allowOther) h+='<label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.88rem"><input type="checkbox" data-other="1"'+(others.length?' checked':'')
    +' onchange="document.getElementById(\''+id+'_other\').style.display=this.checked?\'block\':\'none\'"> 其他（請輸入）</label>';
  h+='</div>';
  if(f.allowOther) h+='<input type="text" id="'+id+'_other" class="input" style="margin-top:6px;display:'+(others.length?'block':'none')+'" placeholder="請輸入..." value="'+esc(others.join('、'))+'">';
  return h+descHtml+'</div>';
}
function multiCheck(f, vals){
  const n=vals.length;
  if(f.required&&!n) return '「'+f.label+'」為必填，請至少選一項';
  if(n){
    if(f.minSel&&n<f.minSel) return '「'+f.label+'」至少要選 '+f.minSel+' 項';
    if(f.maxSel&&n>f.maxSel) return '「'+f.label+'」最多只能選 '+f.maxSel+' 項';
  }
  return '';
}
// 讀出複選欄位的值：回傳 {value:[...]} 或 {error:'訊息'}
function readMultiField(id, f){
  const box=document.getElementById(id); if(!box) return {value:[]};
  const vals=[...box.querySelectorAll('input[type=checkbox]:not([data-other]):checked')].map(el=>el.value);
  const oc=box.querySelector('input[data-other]');
  if(oc&&oc.checked){
    const t=(document.getElementById(id+'_other')?.value||'').trim();
    if(!t) return {error:'「'+f.label+'」勾選了「其他」，請輸入內容'};
    vals.push(t);
  }
  const err=multiCheck(f, vals);
  return err?{error:err}:{value:vals};
}
// 自訂欄位的顯示文字（列表、匯出用）
function cfDisplayValue(f, v){
  if(f.type==='checkbox') return v?'是':'否';
  if(Array.isArray(v)) return v.join('、');
  return v===undefined||v===null?'':String(v);
}

function esc(v) {
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escJs(v) {
  return String(v ?? '')
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 工具函式 ──
function toHalf(str) {
  if (!str) return str;
  return str.replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
            .replace(/　/g, ' ');
}
function applyHalf(el) {
  const v = toHalf(el.value);
  if (v !== el.value) { el.value = v; el.dispatchEvent(new Event('input')); }
}
window.toHalf = toHalf;
window.applyHalf = applyHalf;

function autoSlashDate(el) {
  const isDelete = el._lastLen !== undefined && el.value.length < el._lastLen;
  el._lastLen = el.value.length;
  if (isDelete) return;
  const pos = el.selectionStart;
  const raw = el.value;
  const digits = raw.replace(/\D/g, '').slice(0, 8);
  let out = digits;
  if (digits.length > 4) out = digits.slice(0,4) + '/' + digits.slice(4);
  if (digits.length > 6) out = digits.slice(0,4) + '/' + digits.slice(4,6) + '/' + digits.slice(6);
  if (out !== raw) {
    const slashesBeforeInRaw = (raw.slice(0, pos).match(/\//g) || []).length;
    const slashesBeforeInOut = (out.slice(0, pos).match(/\//g) || []).length;
    const newPos = Math.min(pos + (slashesBeforeInOut - slashesBeforeInRaw), out.length);
    el.value = out;
    el._lastLen = out.length;
    try { el.setSelectionRange(newPos, newPos); } catch(e) {}
  }
}
window.autoSlashDate = autoSlashDate;

// ── 全形→半形：統一監聽所有 input ──
document.addEventListener('input', function(e) {
  const el = e.target;
  const tag = el.tagName;
  const type = (el.type||'').toLowerCase();
  if (tag !== 'INPUT' && tag !== 'TEXTAREA') return;
  if (['checkbox','radio','file','date','datetime-local','time','color','range'].includes(type)) return;
  const v = toHalf(el.value);
  if (v !== el.value) {
    const pos = el.selectionStart;
    el.value = v;
    try { el.setSelectionRange(pos, pos); } catch(e) {}
  }
  if (el.dataset.fmt === 'ymd') autoSlashDate(el);
}, true);

function validateBirthday(v){
  if(!v)return false;
  if(!/^\d{4}\/\d{2}\/\d{2}$/.test(v))return false;
  const[y,m,d]=v.split('/').map(Number);
  const dt=new Date(y,m-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return false;
  const today=new Date();today.setHours(0,0,0,0);
  if(dt>=today)return false;
  if(y<1900)return false;
  return true;
}
function validatePhone(v){if(!v)return true;return /^09\d{8}$/.test(v);}
function validateEmail(v){if(!v)return true;return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);}
function validateId(v){if(!v)return false;return /^[A-Za-z]\d{9}$/.test(v);}
function setFieldError(id,hasError){const el=document.getElementById(id);if(!el)return;el.style.borderColor=hasError?'var(--red)':'';}
function showToast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.classList.remove('show'),3500);}
window.validateBirthday=validateBirthday;

// 判斷工作人員報名是否開放（OR 邏輯）
function isStaffRegOpen(ev) {
  const now = Date.now();
  // 條件1：手動開關 ON → 一律可報名
  if (ev.staffRegistrationOpen) return true;
  // 未手動開放：須設定報名期間（開始、結束至少一個）且在期間內才能報名
  // 沒有設定報名期間＝不開放報名；只設一端的話，另一端不限制
  const start = ev.staffRegistrationStartAt?.toDate?.()?.getTime() ?? null;
  const end   = ev.staffRegistrationEndAt?.toDate?.()?.getTime() ?? null;
  if (start === null && end === null) return false;
  const afterStart = (start === null || now >= start);
  const beforeEnd  = (end   === null || now <= end);
  return afterStart && beforeEnd;
}

// 產生報名資訊說明文字
function buildStaffRegInfoHtml(ev) {
  const fmtDT = ts => {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  };
  const lines = [];
  if (ev.staffRegistrationStartAt) lines.push('報名開始：' + fmtDT(ev.staffRegistrationStartAt));
  if (ev.staffRegistrationEndAt)   lines.push('報名截止：' + fmtDT(ev.staffRegistrationEndAt));
  return lines.length ? lines.map(l=>'<div style="font-size:.75rem;color:var(--muted);margin-top:3px">'+l+'</div>').join('') : '';
}

let currentTurnstileToken='';

function renderTurnstileWidget(containerId){

window.submitSignup=async function(){
  const eventId=curSignupEvent.id;
  const sfs=curSignupEvent.staffFieldSettings||{};
  const sPhoneShow=sfs.phone?.show!==false;
  const sPhoneReq=sfs.phone?.required===true;
  const sEmailShow=sfs.email?.show!==false;
  const sEmailReq=sfs.email?.required===true;
  const name=document.getElementById('suName').value.trim();
  const gender=document.getElementById('suGender').value;
  const birthday=document.getElementById('suBirthday').value.trim();
  const idNumber=document.getElementById('suIdNumber').value.trim();
  const phone=sPhoneShow?(document.getElementById('suPhone')?.value.trim()||''):'';
  const email=sEmailShow?(document.getElementById('suEmail')?.value.trim()||''):'';
  const note=document.getElementById('suNote').value.trim();
  if(!name){showToast('請填寫姓名','error');return;}
  if(!gender){showToast('請選擇性別','error');return;}
  if(!birthday||!validateBirthday(birthday)){setFieldError('suBirthday',true);showToast('請填寫正確的生日格式','error');return;}
  if(!idNumber||!validateId(idNumber)){setFieldError('suIdNumber',true);showToast('請填寫正確的身分證字號','error');return;}
  if(sPhoneShow){
    if(sPhoneReq&&!phone){setFieldError('suPhone',true);showToast('請填寫手機號碼','error');return;}
    if(phone&&!validatePhone(phone)){setFieldError('suPhone',true);showToast('手機號碼格式錯誤','error');return;}
  }
  if(sEmailShow){
    if(sEmailReq&&!email){setFieldError('suEmail',true);showToast('請填寫 E-Mail','error');return;}
    if(email&&!validateEmail(email)){setFieldError('suEmail',true);showToast('Email格式錯誤','error');return;}
  }
  // 自訂欄位
  const customData={};
  const suVis=refreshSignupCf();
  for(const f of curSignupCustomFields){
    if(f.type==='section'||!suVis[f.id])continue; // 隱藏的欄位：不驗證、不送出
    const el=document.getElementById('su_cf_'+f.id); if(!el)continue;
    if(f.type==='multi'){ const r=readMultiField('su_cf_'+f.id,f); if(r.error){showToast(r.error,'error');return;} customData[f.id]=r.value; continue; }
    if(f.type==='checkbox'){
      if(f.required&&!el.checked){showToast('「'+f.label+'」為必填，請勾選','error');return;}
      customData[f.id]=el.checked;
    }
    else{

      if(f.type==='select'&&f.allowOther&&v==='__other__'){
        v=document.getElementById('su_cf_'+f.id+'_other')?.value.trim()||'';
      }
      if(f.required&&!v){showToast('「'+f.label+'」為必填','error');return;}
      customData[f.id]=v;
    }
  }
  const runnerData={name,gender,birthday,phone,email,idNumber,note};
  const btn=document.getElementById('suSubmitBtn');
  if(!currentTurnstileToken){showToast('請稍候，人機驗證還在進行中，請幾秒後再試一次','error');return;}
  // 送出前確認資料
  if(!(await confirmBeforeSubmit([{rows:[['活動',curSignupEvent.name||''],['姓名',name],['性別',gender],['生日',birthday],['身分證',idNumber.toUpperCase()],['手機',phone],['Email',email],['備註',note]].concat(cfConfirmRows(curSignupCustomFields,customData))}]))) return;
  btn.textContent='送出中...'; btn.disabled=true;
  try{
    // 報名改走 Cloud Function（staffAction）：工作人員個資已從公開可讀的
    // 資料庫下架，伺服器端以「身分證當文件ID + transaction 不存在才寫入」
    // 防重複（與原本前端 transaction 的行為一致），並做欄位驗證。
    if(!currentTurnstileToken){showToast('請稍候，人機驗證還在進行中，請幾秒後再試一次','error');btn.textContent='送出報名';btn.disabled=false;return;}
    const res=(await callFn('staffAction')({
      eventId,action:'signup',idNumber,turnstileToken:currentTurnstileToken,
      profile:{name,gender,birthday,phone,email,note},customData
    })).data;
    const reactivated=res.status==='reactivated';
    const content=document.getElementById('signupContent');
    content.innerHTML='<div class="card" style="text-align:center">'
      +'<div style="font-size:2.5rem;margin-bottom:8px">✅</div>'
      +'<div style="font-size:1.05rem;font-weight:900;margin-bottom:4px">'+(reactivated?'已重新啟用報名！':'報名成功！')+'</div>'
      +'<div style="font-size:.82rem;color:var(--muted)">'+esc(curSignupEvent.name)+'</div>'
      +'<div style="margin-top:16px;font-size:.88rem">'+esc(name)+'　'+esc(gender)+'　'+esc(birthday)+'</div>'
      +(reactivated?'<div class="csv-hint" style="margin-top:12px;text-align:left">您先前的取消申請已自動撤回。</div>':'')
      +'<div class="csv-hint" style="margin-top:16px;text-align:left">如需查詢 / 修改，請至「查詢報名／修改」分頁輸入身分證字號查詢 / 修改。</div>'
      +'</div>';
  }catch(e){
    resetTurnstileWidget();
    if((e.message||'').includes('DUP_SIGNUP')||e.code==='functions/already-exists'){showToast('您已報名過此活動','error');btn.textContent='送出報名';btn.disabled=false;return;}
    showToast('報名失敗：'+e.message,'error');btn.textContent='送出報名';btn.disabled=false;
  }
}

let allStatusEvents=[];
let curStatusEvent=null;
let lastStatusEventId=null;
let staffCache={}; // 查詢回傳的本人資料快取（供修改表單預填）

async function initStatusPage(){
  const content=document.getElementById('statusContent');
  content.innerHTML='<div class="card"><div class="loading-cell">載入中...</div></div>';
  const snap=await getDocs(query(collection(db,'systems',SYS,'events'),orderBy('createdAt','desc')));
  allStatusEvents=await filterBySeries(snap.docs.map(d=>({id:d.id,...d.data()})));
  if(!allStatusEvents.length){
    content.innerHTML='<div class="card"><div class="loading-cell">目前沒有活動資料</div></div>';
    return;
  }
  if(allStatusEvents.length===1){
    await selectStatusEvent(allStatusEvents[0].id);
  } else {
    let html='<div class="card"><div class="input-group"><label>選擇活動</label>'
      +'<select id="statusEventSelect" class="input" onchange="onStatusEventSelect()">'
      +'<option value="">請選擇...</option>';
    html+=await eventOptionsHtml(allStatusEvents,lastStatusEventId);
    html+='</select></div></div><div id="statusForm"></div>';
    content.innerHTML=html;
    if(lastStatusEventId&&allStatusEvents.find(e=>e.id===lastStatusEventId)){
      await selectStatusEvent(lastStatusEventId, true);
    }
  }
}

window.onStatusEventSelect=async function(){
  const id=document.getElementById('statusEventSelect').value;
  document.getElementById('statusResult').innerHTML='';
  if(!id){document.getElementById('statusForm').innerHTML='';curStatusEvent=null;lastStatusEventId=null;return;}
  await selectStatusEvent(id, true);
}

async function selectStatusEvent(eventId, keepWrapper){
  curStatusEvent=allStatusEvents.find(e=>e.id===eventId);
  lastStatusEventId=eventId;
  document.getElementById('statusResult').innerHTML='';
  const formHtml='<div class="card">'
    +'<div class="csv-hint">輸入身分證字號查詢報名記錄，開放報名期間可修改資料。</div>'
    +'<div class="input-group"><label>身分證字號</label>'
    +'<input id="statusIdNum" type="text" class="input" placeholder="A123456789" oninput="applyHalf(this)"></div>'
    +'<button class="btn btn-primary btn-full" onclick="doStatusQuery()">🔍 查詢報名</button>'
    +'</div>'
    +(curStatusEvent.staffMultiSignup?.enabled===true?batchQueryCardHtml():'');
  if(keepWrapper){
    document.getElementById('statusForm').innerHTML=formHtml;
  } else {
    document.getElementById('statusContent').innerHTML=formHtml;
  }
}

window.doStatusQuery=async function(){
  if(!curStatusEvent){showToast('請先選擇活動','error');return;}
  const idNum=document.getElementById('statusIdNum').value.trim();
  const result=document.getElementById('statusResult');
  if(!idNum){showToast('請輸入身分證字號','error');return;}
  if(!validateId(idNum)){showToast('身分證字號格式錯誤','error');return;}
  result.innerHTML='<div class="card"><div class="loading-cell">查詢中...</div></div>';

  const eventId=curStatusEvent.id;
  const ev=curStatusEvent;
  // 查詢改走 Cloud Function（工作人員資料已不開放讀取），把回傳資料
  // 快取起來給修改表單使用
  let qres;
  try{
    qres=(await callFn('staffAction')({eventId,action:'query',idNumber:idNum.toUpperCase()})).data;
  }catch(err){
    result.innerHTML='<div class="card"><div class="loading-cell" style="color:var(--red)">查詢失敗：'+esc(err.message)+'</div></div>';return;
  }
  if(!(qres.matched||[]).length){result.innerHTML='<div class="card"><div class="loading-cell">查無報名記錄</div></div>';return;}
  staffCache={};

  let html='';
  for(const m of qres.matched){
    const e=m.data;
    const eDocRef={id:m.staffDocId};
    staffCache[m.staffDocId]=m.data;
    const cardId='sCard_'+eventId+'_'+eDocRef.id;
    html+='<div class="card" id="'+cardId+'">';
    html+='<div style="font-size:.78rem;color:var(--muted);margin-bottom:8px">'+esc(ev.name)+(ev.date?'　'+esc(ev.date):'')+'</div>';
    html+='<div style="font-size:1rem;font-weight:700;margin-bottom:4px">'+esc(e.name)+'</div>';
    html+='<div style="font-size:.82rem;color:var(--muted)">'+esc(e.gender)+'　'+esc(e.birthday)+(e.phone?'　'+esc(e.phone):'')+'</div>';
    if(e.batchCode) html+='<div style="font-size:.75rem;color:var(--muted);margin-top:4px">多人報名（批次 <span class="mono">'+esc(e.batchCode)+'</span>）</div>';
    if(isStaffRegOpen(ev)){
      if(e.cancelRequested){
        html+='<div id="'+cardId+'_actions">';
        html+='<div style="padding:10px 12px;background:var(--surface2);border-radius:8px;font-size:.82rem;color:var(--muted);margin-bottom:8px">⏳ 已送出取消申請，請等待主辦方確認</div>';
        html+='<button class="btn btn-ghost btn-full" onclick="withdrawStaffCancelRequest(\''+eventId+'\',\''+eDocRef.id+'\',\''+cardId+'\')">↩️ 撤銷取消申請</button>';
        html+='</div>';
      } else {
        html+='<div id="'+cardId+'_actions">';
        html+='<div style="display:flex;gap:8px;margin-top:12px">';
        html+='<button class="btn btn-ghost btn-sm" onclick="showEditForm(\''+eventId+'\',\''+eDocRef.id+'\',\''+cardId+'\')">✏️ 修改資料</button>';
        html+='<button class="btn btn-danger btn-sm" onclick="requestCancelStaffEntry(\''+eventId+'\',\''+eDocRef.id+'\',\''+cardId+'\')">🗑️ 申請取消報名</button>';
        html+='</div>';
        html+='<div id="'+cardId+'_edit"></div>';
        html+='</div>';
      }
    }
    html+='</div>';
  }
  result.innerHTML=html;
}
// 呼叫伺服器用目前的身分證（改過身分證後，文件 ID 還是舊的號碼）
const staffKey=docId=>(staffCache[docId]&&staffCache[docId].idNumber)||docId;

    showToast('已送出取消申請');

}

window.showEditForm=async function(eventId,staffDocId,cardId){
  const box=document.getElementById(cardId+'_edit');
  if(box.dataset.open==='1'){box.innerHTML='';box.dataset.open='';return;}
  box.dataset.open='1';
  // 個資改由查詢時的 Cloud Function 回傳（staff 集合已不開放讀取）
  const e=staffCache[staffDocId];
  if(!e){showToast('資料已過期，請重新查詢','error');box.innerHTML='';box.dataset.open='';return;}
  const evDoc=await getDoc(doc(db,'systems',SYS,'events',eventId));
  const customFields=evDoc.data()?.staffCustomFields||[];
  const sfs=evDoc.data()?.staffFieldSettings||{};
  const phoneShow=sfs.phone?.show!==false, phoneReq=sfs.phone?.required===true;
  const emailShow=sfs.email?.show!==false, emailReq=sfs.email?.required===true;
  const cd=e.customData||{};
  let html='<div class="card" style="background:var(--surface2);margin-top:12px">';
  html+='<div class="csv-hint">如需修改身分證字號，請直接填入正確號碼。</div>';
  html+='<div class="input-group"><label>姓名 <span class="required-star">*</span></label><input id="'+cardId+'_name" type="text" class="input" value="'+esc(e.name||'')+'"></div>';
  html+='<div class="input-group"><label>性別 <span class="required-star">*</span></label><select id="'+cardId+'_gender" class="input"><option value="男"'+(e.gender==='男'?' selected':'')+'>男</option><option value="女"'+(e.gender==='女'?' selected':'')+'>女</option></select></div>';
  html+='<div class="input-group"><label>生日 <span class="required-star">*</span></label>'
    +'<div class="input-row">'
    +'<input id="'+cardId+'_birthday" data-fmt="ymd" type="text" class="input" value="'+esc(e.birthday||'')+'" oninput="applyHalf(this)">'
    +'<button type="button" class="btn btn-ghost btn-sm" onclick="var _d=document.getElementById(\''+cardId+'_birthdayPicker\');_d.showPicker?_d.showPicker():_d.click()">📅</button>'
    +'<input type="date" id="'+cardId+'_birthdayPicker" style="display:none" '
    +'onchange="if(this.value){const[y,m,d]=this.value.split(\'-\');document.getElementById(\''+cardId+'_birthday\').value=y+\'/\'+m+\'/\'+d;this.value=\'\'}">'
    +'</div></div>';
  html+='<div class="input-group"><label>身分證字號 <span class="required-star">*</span></label><input id="'+cardId+'_idNumber" type="text" class="input" value="'+esc(e.idNumber||'')+'" oninput="applyHalf(this)"></div>';
  if(phoneShow)html+='<div class="input-group"><label>手機'+(phoneReq?' <span class="required-star">*</span>':'')+'</label><input id="'+cardId+'_phone" type="tel" class="input" value="'+esc(e.phone||'')+'" oninput="applyHalf(this)"></div>';
  if(emailShow)html+='<div class="input-group"><label>Email'+(emailReq?' <span class="required-star">*</span>':'')+'</label><input id="'+cardId+'_email" type="email" class="input" value="'+esc(e.email||'')+'" oninput="applyHalf(this)"></div>';
  html+='<div class="input-group"><label>備註</label><input id="'+cardId+'_note" type="text" class="input" value="'+esc(e.note||'')+'"></div>';
  customFields.forEach(f=>{
    const fid=cardId+'_cf_'+f.id;
    const reqMark=f.required?' <span class="required-star">*</span>':'';
    const descHtml=f.description?'<div style="font-size:.75rem;color:var(--text);margin-top:2px">'+esc(f.description)+'</div>':'';
    html+='<div id="'+cardId+'_cf_row_'+f.id+'">';
    if(f.type==='section'){
      html+=cfSectionHtml(f);
    }else if(f.type==='multi'){
      html+=multiFieldHtml(fid, f, cd[f.id], reqMark, descHtml);
    }else if(f.type==='select'){
      const isOtherVal=f.allowOther&&cd[f.id]!==undefined&&cd[f.id]!==''&&!(f.options||[]).includes(cd[f.id]);
      html+='<div class="input-group"><label>'+esc(f.label)+reqMark+'</label><select id="'+fid+'" class="input"'+(f.allowOther?' onchange="document.getElementById(\''+fid+'_other\').style.display=this.value===\'__other__\'?\'block\':\'none\'"':'')+'><option value="">請選擇...</option>';
      (f.options||[]).forEach(o=>{html+='<option value="'+esc(o)+'"'+(cd[f.id]===o?' selected':'')+'>'+esc(o)+'</option>';});
      if(f.allowOther)html+='<option value="__other__"'+(isOtherVal?' selected':'')+'>其他（請輸入）</option>';
      html+='</select>'+(f.allowOther?'<input type="text" id="'+fid+'_other" class="input" style="margin-top:6px;display:'+(isOtherVal?'block':'none')+'" placeholder="請輸入..." value="'+esc(isOtherVal?cd[f.id]:'')+'">':'')+descHtml+'</div>';
    }else if(f.type==='checkbox'){
      html+='<div class="input-group"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="'+fid+'" '+(cd[f.id]?'checked':'')+'> '+esc(f.label)+reqMark+'</label>'+descHtml+'</div>';
    }else{
      html+='<div class="input-group"><label>'+esc(f.label)+reqMark+'</label><input id="'+fid+'" type="text" class="input" value="'+esc(cd[f.id]||'')+'">'+descHtml+'</div>';
    }
    html+='</div>';
  });
  html+='<button class="btn btn-primary btn-full" onclick="saveEdit(\''+eventId+'\',\''+staffDocId+'\',\''+cardId+'\')">儲存修改</button>';
  html+='</div>';
  box.innerHTML=html;
  box.dataset.customFields=JSON.stringify(customFields);
  box.dataset.sfs=JSON.stringify(sfs);
  box.dataset.evdate=evDoc.data()?.date||'';
  // 多人報名的成員：共同填寫的欄位只能由填表人用「批次代碼＋手機」修改，這裡鎖住
  if(e.batchCode){
    const sids=cfSharedIds(customFields);
    box.dataset.cffixed=JSON.stringify(cfFixedFromStored(customFields,cd));
    let noted=false;
    customFields.forEach(f=>{
      if(!sids.has(f.id))return;
      const row=document.getElementById(cardId+'_cf_row_'+f.id); if(!row)return;
      row.querySelectorAll('input,select,textarea').forEach(el=>{el.disabled=true;});
      if(!noted){ row.insertAdjacentHTML('beforebegin','<div class="csv-hint">此筆是多人報名（批次 '+esc(e.batchCode)+'），共同填寫的欄位請由填表人用「批次代碼＋手機」修改。</div>'); noted=true; }
    });
  } else delete box.dataset.cffixed;
  refreshEditCf(cardId);
}

window.saveEdit=async function(eventId,staffDocId,cardId){
  let sfs={}; try{sfs=JSON.parse(document.getElementById(cardId+'_edit')?.dataset.sfs||'{}');}catch(e){}
  const name=document.getElementById(cardId+'_name').value.trim();
  const gender=document.getElementById(cardId+'_gender').value;
  const birthday=document.getElementById(cardId+'_birthday').value.trim();
  const idNumber=document.getElementById(cardId+'_idNumber').value.trim();
  const phone=(sfs.phone?.show!==false)?(document.getElementById(cardId+'_phone')?.value.trim()||''):'';
  const email=(sfs.email?.show!==false)?(document.getElementById(cardId+'_email')?.value.trim()||''):'';
  const note=document.getElementById(cardId+'_note').value.trim();
  if(!name){showToast('姓名為必填','error');return;}
  if(!gender){showToast('性別為必選','error');return;}
  if(!birthday||!validateBirthday(birthday)){showToast('生日格式錯誤','error');return;}
  if(!idNumber||!validateId(idNumber)){showToast('身分證字號格式錯誤','error');return;}
  if(sfs.phone?.show!==false){
    if(sfs.phone?.required&&!phone){setFieldError(cardId+'_phone',true);showToast('請填寫手機號碼','error');return;}
    if(phone&&!validatePhone(phone)){setFieldError(cardId+'_phone',true);showToast('手機號碼格式錯誤','error');return;}
    setFieldError(cardId+'_phone',false);
  }
  if(sfs.email?.show!==false){
    if(sfs.email?.required&&!email){setFieldError(cardId+'_email',true);showToast('請填寫 E-Mail','error');return;}
    if(email&&!validateEmail(email)){setFieldError(cardId+'_email',true);showToast('Email格式錯誤','error');return;}
    setFieldError(cardId+'_email',false);
  }
  const customFields=JSON.parse(document.getElementById(cardId+'_edit').dataset.customFields||'[]');
  const customData={};
  const editVis=refreshEditCf(cardId);
  for(const f of customFields){
    if(f.type==='section'||!editVis[f.id])continue; // 隱藏的欄位：不送出
    const el=document.getElementById(cardId+'_cf_'+f.id); if(!el)continue;
    if(f.type==='multi'){ const r=readMultiField(cardId+'_cf_'+f.id,f); if(r.error){showToast(r.error,'error');return;} customData[f.id]=r.value; continue; }
    if(f.type==='checkbox'){
      if(f.required&&!el.checked){showToast('「'+f.label+'」為必填，請勾選','error');return;}
      customData[f.id]=el.checked;
    }
    else{
      let v=el.value.trim();
      if(f.type==='select'&&f.allowOther&&v==='__other__'){
        v=document.getElementById(cardId+'_cf_'+f.id+'_other')?.value.trim()||'';
      }
      if(f.required&&!v){showToast('「'+f.label+'」為必填','error');return;}
      customData[f.id]=v;
    }
  }
  try{
    // 儲存改走 Cloud Function（伺服器端驗證後就地更新；文件ID＝查詢用的
    // 原身分證，欄位裡的身分證可修改）
    const payload={
      eventId,action:'save',idNumber:staffKey(staffDocId),
      profile:{name,gender,birthday,phone,email,note,newIdNumber:idNumber.toUpperCase()},customData
    };
    let res=(await callFn('staffAction')(payload)).data;
    // 改了姓名、性別、生日或身分證：確認是同一人修改資料（不能換人）
    if(res.status==='confirm-identity-change'){
      if(!(await confirmIdentityChange(res.fields||[],''))) return;
      res=(await callFn('staffAction')({...payload,confirmIdentityChange:true})).data;
    }
    Object.assign(staffCache[staffDocId]||{},{name,gender,birthday,idNumber:idNumber.toUpperCase(),phone,email,note,customData});
    showToast('已儲存修改');
    document.getElementById(cardId+'_edit').innerHTML='<div class="csv-hint" style="margin-top:12px">✅ 修改已儲存，如有修改身分證，下次請用新號碼查詢。</div>';
  }catch(err){showToast('儲存失敗：'+err.message,'error');}
}

// 對話框：送出前確認、修改不能換人的警告（跟參加者頁同一套）

function idDialog(o){
  const dlg=document.createElement('div');
  dlg.className='id-dialog';
  dlg.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9998;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box';
  const btns=(o.buttons||[]).map((b,i)=>'<button type="button" data-i="'+i+'" class="btn '+(b.primary?'btn-primary':'btn-ghost')+' btn-sm">'+esc(b.label)+'</button>').join('');
  dlg.innerHTML='<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;max-width:480px;width:100%;box-sizing:border-box;max-height:90vh;overflow:auto">'
    +'<div style="font-size:1rem;font-weight:700;margin-bottom:8px">'+(o.who?esc(o.who)+'：':'')+esc(o.title)+'</div>'+(o.html||'')
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'+btns+'</div></div>';
  document.body.appendChild(dlg);
  return new Promise(resolve=>{
    dlg.querySelectorAll('button[data-i]').forEach(el=>el.onclick=()=>{ dlg.remove(); resolve({value:o.buttons[+el.dataset.i].value}); });
  });
}
async function confirmIdentityChange(fields, who){
  const r=await idDialog({who, title:'確定是同一人修改資料嗎？',
    html:(fields&&fields.length?'<div style="font-size:.82rem;margin-bottom:6px">你改了：<strong>'+esc(fields.join('、'))+'</strong></div>':'')
      +'<div style="font-size:.82rem;line-height:1.7;color:var(--accent)">系統不允許同一筆資料換不同人，若要換人，請先申請取消報名，再新增報名。</div>',
    buttons:[{label:'確定，是同一人',value:'yes',primary:true},{label:'取消',value:'no'}]});
  return r.value==='yes';
}
async function confirmBeforeSubmit(sections, title){
  const tbl=rows=>'<table style="width:100%;border-collapse:collapse;margin-bottom:8px">'+rows.filter(r=>r[1]!==''&&r[1]!=null).map(r=>'<tr><td style="padding:3px 8px 3px 0;font-size:.78rem;color:var(--muted);white-space:nowrap;vertical-align:top;border:none">'+esc(r[0])+'</td><td style="padding:3px 0;font-size:.88rem;word-break:break-all;border:none">'+esc(String(r[1]))+'</td></tr>').join('')+'</table>';
  const html=sections.map(s=>(s.title?'<div style="font-weight:700;font-size:.88rem;margin-top:8px;border-top:1px solid var(--border);padding-top:8px">'+esc(s.title)+'</div>':'')+tbl(s.rows)).join('')
    +'<div style="font-size:.78rem;color:var(--accent);margin-top:4px">請確認資料正確，尤其是姓名、性別、生日、身分證字號。</div>';
  const r=await idDialog({title:title||'請確認報名資料', html, buttons:[{label:'確認送出',value:'ok',primary:true},{label:'返回修改',value:'back'}]});
  return r.value==='ok';
}
function cfConfirmRows(fields, data){
  const rows=[];
  (fields||[]).forEach(f=>{
    if(f.type==='section'||!(f.id in (data||{}))) return;
    let v=data[f.id];
    if(Array.isArray(v)) v=v.join('、'); else if(v===true) v='是'; else if(v===false) v='否';
    rows.push([f.label,v]);
  });
  return rows;
}

const MF={};
function mfInit(ns, o){
  const st={ns, seq:0, keys:[], docIds:{}, ...o};
  st.sids=cfSharedIds(st.fields);
  MF[ns]=st; return st;

function mfCfHtml(f, id, val){
  const reqMark=f.required?' <span class="required-star">*</span>':'';
  const descHtml=f.description?'<div style="font-size:.75rem;color:var(--text);margin-top:2px">'+esc(f.description)+'</div>':'';
  if(f.type==='multi') return multiFieldHtml(id, f, Array.isArray(val)?val:[], reqMark, descHtml);
  if(f.type==='checkbox') return '<div class="input-group"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="'+id+'"'+(val===true?' checked':'')+'> '+esc(f.label)+reqMark+'</label>'+descHtml+'</div>';
  if(f.type==='select'){
    const v=typeof val==='string'?val:'';
    const isOther=f.allowOther&&v!==''&&!(f.options||[]).includes(v);
    return '<div class="input-group"><label>'+esc(f.label)+reqMark+'</label><select id="'+id+'" class="input"'
      +(f.allowOther?' onchange="document.getElementById(\''+id+'_other\').style.display=this.value===\'__other__\'?\'block\':\'none\'"':'')+'>'
      +'<option value="">請選擇...</option>'
      +(f.options||[]).map(o=>'<option value="'+esc(o)+'"'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join('')
      +(f.allowOther?'<option value="__other__"'+(isOther?' selected':'')+'>其他（請輸入）</option>':'')
      +'</select>'
      +(f.allowOther?'<input type="text" id="'+id+'_other" class="input" style="margin-top:6px;display:'+(isOther?'block':'none')+'" placeholder="請輸入..." value="'+esc(isOther?v:'')+'">':'')
      +descHtml+'</div>';
  }
  return '<div class="input-group"><label>'+esc(f.label)+reqMark+'</label><input id="'+id+'" type="text" class="input" value="'+esc(typeof val==='string'?val:'')+'">'+descHtml+'</div>';
}
function mfFieldsHtml(fields, idPrefix, rowPrefix, values){
  return fields.map(f=>'<div id="'+rowPrefix+f.id+'">'+(f.type==='section'?cfSectionHtml(f):mfCfHtml(f,idPrefix+f.id,(values||{})[f.id]))+'</div>').join('');
}
function mfCollectCf(fields, idPrefix, vis){
  const data={};
  for(const f of fields){
    if(f.type==='section'||!vis[f.id]) continue;
    const id=idPrefix+f.id; const el=document.getElementById(id); if(!el) continue;
    if(f.type==='multi'){ const r=readMultiField(id,f); if(r.error) return {error:r.error}; data[f.id]=r.value; continue; }
    if(f.type==='checkbox'){ if(f.required&&!el.checked) return {error:'「'+f.label+'」為必填，請勾選'}; data[f.id]=el.checked; continue; }
    let v=el.value.trim();
    if(f.type==='select'&&f.allowOther&&v==='__other__') v=(document.getElementById(id+'_other')?.value||'').trim();
    if(f.required&&!v) return {error:'「'+f.label+'」為必填'};
    data[f.id]=v;
  }
  return {data};
}
const mfPersonFields=st=>st.fields.filter(f=>!st.sids.has(f.id));

  if(sfs.email?.show!==false) h+=inp('email','E-Mail',sfs.email?.required===true,e.email,'example@email.com','email');

      :'<button type="button" class="btn btn-sm btn-danger mf-act" onclick="mfBatchAct(\''+ns+'\','+k+',\'cancel\')">申請取消這位</button>';

      +mfFieldsHtml(shared, ns+'S_cf_', ns+'S_cf_row_', (data&&data.shared)||{})+'</div>';

window.mfAddPerson=function(ns, p){
  const st=MF[ns]; if(!st) return;
  if(!st.edit&&st.keys.length>=st.max){ showToast('一次最多報名 '+st.max+' 位','error'); return; }
  const k=++st.seq; st.keys.push(k);
  if(p&&p.staffDocId) st.docIds[k]=p.staffDocId;
  document.getElementById(ns+'_persons').insertAdjacentHTML('beforeend', mfPersonHtml(st,k,p));
  mfRefresh(ns);
};
window.mfRemovePerson=function(ns, k){
  const st=MF[ns]; if(!st) return;
  if(st.keys.length<=1){ showToast('至少要有一位','error'); return; }
  const name=document.getElementById(ns+k+'_name')?.value.trim();
  if(name&&!confirm('確定移除「'+name+'」？'))return;
  document.getElementById(ns+k+'_card')?.remove();
  st.keys=st.keys.filter(x=>x!==k);
  mfRefresh(ns);
};
window.mfRefresh=function(ns){
  const st=MF[ns]; if(!st) return null;
  st.keys.forEach((k,i)=>{
    const P=ns+k+'_';
    const t=document.querySelector('#'+P+'card .mf-title'); if(t) t.textContent='第 '+(i+1)+' 位';
    const rm=document.querySelector('#'+P+'card .mf-remove'); if(rm) rm.style.display=st.keys.length>1?'':'none';
  });
  const add=document.getElementById(ns+'_addBtn');
  if(add){ add.disabled=st.keys.length>=st.max; add.textContent=st.keys.length>=st.max?'已達每次上限 '+st.max+' 位':'＋ 再加一位（最多 '+st.max+' 位）'; }
  const pf=mfPersonFields(st), sf=mfSharedFields(st);
  const persons=st.keys.map(k=>{
    const values={}; pf.forEach(f=>{ if(f.type!=='section') values[f.id]=cfReadRaw(ns+k+'_cf_'+f.id,f); });
    return {values, ctx:{groupId:'', gender:document.getElementById(ns+k+'_gender')?.value||'', age:cfAgeFrom(document.getElementById(ns+k+'_birthday')?.value.trim(), st.ev.date||'')}};
  });
  const shared={}; sf.forEach(f=>{ if(f.type!=='section') shared[f.id]=cfReadRaw(ns+'S_cf_'+f.id,f); });
  const vm=cfVisibilityMulti(st.fields, shared, persons);
  st.keys.forEach((k,i)=>pf.forEach(f=>{ const row=document.getElementById(ns+k+'_cf_row_'+f.id); if(row) row.style.display=vm.persons[i][f.id]?'':'none'; }));
  sf.forEach(f=>{ const row=document.getElementById(ns+'S_cf_row_'+f.id); if(row) row.style.display=vm.shared[f.id]?'':'none'; });
  const sc=document.getElementById(ns+'_sharedCard'); if(sc) sc.style.display=sf.some(f=>vm.shared[f.id]&&f.type!=='section')?'':'none';
  return vm;
};
['input','change'].forEach(evt=>document.addEventListener(evt,e=>{
  const w=e.target&&e.target.closest&&e.target.closest('[data-smf]'); if(w) mfRefresh(w.dataset.smf);
},true));
function mfRead(st){
  const ns=st.ns, sfs=st.ev.staffFieldSettings||{};
  const vm=mfRefresh(ns);
  const submitter={name:document.getElementById(ns+'_sbName').value.trim(), phone:document.getElementById(ns+'_sbPhone').value.trim(), email:document.getElementById(ns+'_sbEmail').value.trim()};
  if(!submitter.name) return {error:'請填寫填表人姓名'};
  if(!/^09\d{8}$/.test(submitter.phone)) return {error:'請填寫正確的填表人手機（09開頭10碼）'};
  if(submitter.email&&!validateEmail(submitter.email)) return {error:'填表人 Email 格式錯誤'};
  const persons=[]; const seen={};
  for(let i=0;i<st.keys.length;i++){
    const k=st.keys[i], P=ns+k+'_', v=id=>(document.getElementById(P+id)?.value||'').trim();
    const p={name:v('name'), gender:v('gender'), birthday:v('birthday'), idNumber:v('idNumber').toUpperCase(), phone:v('phone'), email:v('email'), note:v('note')};
    const who='第 '+(i+1)+' 位'+(p.name?'（'+p.name+'）':'')+'：';
    if(!p.name) return {error:who+'請填寫姓名'};
    if(!p.gender) return {error:who+'請選擇性別'};
    if(!p.birthday||!validateBirthday(p.birthday)) return {error:who+'請填寫正確的生日（yyyy/mm/dd）'};
    if(!validateId(p.idNumber)) return {error:who+'請填寫正確的身分證字號'};
    if(seen[p.idNumber]) return {error:'第 '+seen[p.idNumber]+' 位和第 '+(i+1)+' 位的身分證字號相同，請刪除其中一位'};
    seen[p.idNumber]=i+1;
    if(sfs.phone?.show!==false&&sfs.phone?.required&&!p.phone) return {error:who+'請填寫手機號碼'};
    if(p.phone&&!validatePhone(p.phone)) return {error:who+'手機號碼格式錯誤'};
    if(sfs.email?.show!==false&&sfs.email?.required&&!p.email) return {error:who+'請填寫 E-Mail'};
    if(p.email&&!validateEmail(p.email)) return {error:who+'Email 格式錯誤'};
    const r=mfCollectCf(mfPersonFields(st), P+'cf_', vm.persons[i]);
    if(r.error) return {error:who+r.error};
    p.customData=r.data;
    if(st.edit) p.staffDocId=st.docIds[k];
    persons.push(p);
  }
  const rs=mfCollectCf(mfSharedFields(st), ns+'S_cf_', vm.shared);
  if(rs.error) return {error:'共同填寫：'+rs.error};
  return {payload:{submitter, shared:rs.data, persons}};
}
function mfConfirmSections(st,pl){
  const out=[{title:'填表人',rows:[['姓名',pl.submitter.name],['手機',pl.submitter.phone],['Email',pl.submitter.email||'']]}];
  const sh=cfConfirmRows(mfSharedFields(st),pl.shared);
  if(sh.length) out.push({title:'共同填寫',rows:sh});
  pl.persons.forEach((p,i)=>out.push({title:'第 '+(i+1)+' 位',rows:[['姓名',p.name],['性別',p.gender],['生日',p.birthday],['身分證',p.idNumber],['手機',p.phone],['Email',p.email],['備註',p.note]].concat(cfConfirmRows(mfPersonFields(st),p.customData))}));
  return out;
}

window.mfSubmitSignup=async function(ns){
  const st=MF[ns]; if(!st||st.busy) return;
  const r=mfRead(st);
  if(r.error){ showToast(r.error,'error'); return; }
  if(!currentTurnstileToken){ showToast('請稍候，人機驗證還在進行中，請幾秒後再試一次','error'); return; }
  st.busy=true;
  if(!(await confirmBeforeSubmit(mfConfirmSections(st,r.payload)))){ st.busy=false; return; }
  const btn=document.getElementById(ns+'_submitBtn');
  btn.disabled=true; btn.textContent='送出中...';
  try{
    const res=(await callFn('staffBatchSignup')({eventId:curSignupEvent.id, ...r.payload, turnstileToken:currentTurnstileToken})).data;
    showStaffBatchSuccess(res, r.payload.submitter);
  }catch(e){
    showToast('報名失敗：'+e.message,'error');
    resetTurnstileWidget();
  }finally{
    st.busy=false;
    const b=document.getElementById(ns+'_submitBtn'); if(b){ b.disabled=false; b.textContent='送出報名'; }
  }
};

window.doBatchQuery=async function(cred){
  if(!curStatusEvent){ showToast('請先選擇活動','error'); return; }
  const code=(cred?cred.code:document.getElementById('bqCode').value).trim().toUpperCase();
  const phone=(cred?cred.phone:document.getElementById('bqPhone').value).trim();
  if(!code||!phone){ showToast('請填寫批次代碼與填表人手機','error'); return; }
  const out=document.getElementById('statusResult');
  out.innerHTML='<div class="card"><div class="loading-cell">查詢中...</div></div>';
  try{
    const ev=curStatusEvent;
    const res=(await callFn('staffBatch')({eventId:ev.id, batchCode:code, phone, action:'get'})).data;
    const st=mfInit('mb',{ev, fields:ev.staffCustomFields||[], max:999, edit:true, regOpen:res.regOpen, cred:{code:res.batchCode||code, phone}});
    out.innerHTML='<div class="card" style="text-align:center"><div style="font-size:.75rem;color:var(--muted)">批次代碼</div><div class="mono" style="font-size:1.5rem;font-weight:900;color:var(--accent);letter-spacing:2px">'+esc(st.cred.code)+'</div>'
      +'<div style="font-size:.8rem;color:var(--muted)">共 '+(res.persons||[]).length+' 位。要加人請另外報名；要退出請按該位的「申請取消」。</div></div>'
      +'<div id="mbWrap">'+mfFormHtml(st,res)+'</div>';
    (res.persons||[]).forEach(p=>mfAddPerson('mb',p));
    if(!res.regOpen) out.querySelectorAll('input,select,textarea,button.mf-act,#mb_submitBtn').forEach(el=>{el.disabled=true;});
  }catch(e){
    out.innerHTML='';
    showToast('查詢失敗：'+e.message,'error');
  }
};
window.mfSaveBatch=async function(ns){
  const st=MF[ns]; if(!st||st.busy) return;
  const r=mfRead(st);
  if(r.error){ showToast(r.error,'error'); return; }
  const btn=document.getElementById(ns+'_submitBtn');
  st.busy=true; btn.disabled=true; btn.textContent='儲存中...';
  try{
    const fn=callFn('staffBatch');
    const payload={eventId:st.ev.id, batchCode:st.cred.code, phone:st.cred.phone, action:'save', ...r.payload};
    let res=(await fn(payload)).data;
    if(res.status==='confirm-identity-change'){
      for(const c of res.persons||[]){
        const p=r.payload.persons[c.index]||{};
        if(!(await confirmIdentityChange(c.fields||[], '第 '+(c.index+1)+' 位（'+(p.name||'')+'）'))) return;
      }
      res=(await fn({...payload, confirmIdentityChange:true})).data;
    }
    showToast('整批修改已儲存');
    await doBatchQuery({code:st.cred.code, phone:r.payload.submitter.phone});
  }catch(e){
    showToast('儲存失敗：'+e.message,'error');
  }finally{
    st.busy=false;
    const b=document.getElementById(ns+'_submitBtn'); if(b&&b.textContent==='儲存中...'){ b.disabled=false; b.textContent='儲存整批修改'; }
  }
};
window.mfBatchAct=async function(ns,k,action){
  const st=MF[ns]; if(!st) return;
  const name=document.getElementById(ns+k+'_name')?.value.trim()||'';
  if(action==='cancel'&&!confirm('確定替「'+name+'」申請取消報名？送出後由主辦單位確認才會刪除。'))return;
  try{
    await callFn('staffBatch')({eventId:st.ev.id, batchCode:st.cred.code, phone:st.cred.phone, action, staffDocId:st.docIds[k]});
    showToast(action==='cancel'?'已送出取消申請':'已撤銷取消申請');
    await doBatchQuery(st.cred);
  }catch(e){ showToast('失敗：'+e.message,'error'); }
};

// ── 確認網址指定的系統 ──
// 有帶系統代碼：讀出系統名稱顯示在頁首。
// 沒帶代碼：依總後台的設定，列出開放的系統讓人選，或請對方確認網址。
async function initSystem(){
  if(SYS){
    let snap=null;
    if(SYS_RE.test(SYS)) snap=await getDoc(doc(db,'systems',SYS)).catch(()=>null);
    if(snap&&snap.exists()){
      const name=snap.data().name||SYS;
      document.getElementById('sysName').textContent=name;
      document.title=name+'｜工作人員服務';
      await applySeriesHeader('工作人員服務');
      return true;
    }
    showSysGate('<h3 style="margin-bottom:8px">找不到這個報名系統</h3><p style="color:var(--muted);font-size:.88rem">請確認報名網址是否正確。</p>');
    return false;
  }
  let list=[];
  try{
    const st=await getDoc(doc(db,'platform','settings'));
    if(st.exists()&&st.data().showSystemList===true){
      const snap=await getDocs(query(collection(db,'systems'),where('listed','==',true)));
      list=snap.docs.map(d=>({id:d.id,name:d.data().name||d.id})).sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
    }
  }catch(e){ console.warn('系統清單讀取失敗',e); }
  if(list.length){
    showSysGate('<h3 style="margin-bottom:4px">請選擇報名系統</h3>'
      +list.map(x=>'<a class="sys-pick" href="'+location.pathname+'?s='+encodeURIComponent(x.id)+'">'+esc(x.name)+'</a>').join(''));
  }else{
    showSysGate('<h3 style="margin-bottom:8px">請使用正確的報名網址</h3><p style="color:var(--muted);font-size:.88rem">這個網址沒有指定報名系統，請向主辦單位確認報名網址。</p>');
  }
  return false;
}
function showSysGate(html){
  document.body.classList.add('no-sys');
  const g=document.getElementById('sysGate');
  g.innerHTML=html; g.style.display='block';
}
