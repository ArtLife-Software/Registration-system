<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動報名系統｜參加者服務</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3349;--accent:#f97316;--accent2:#fb923c;--green:#22c55e;--red:#ef4444;--text:#e8eaf0;--muted:#9aa1b5;--mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
.wrap{max-width:560px;margin:0 auto;padding:20px;padding-bottom:90px;}
.header{text-align:center;padding:24px 0 16px;}
.header .logo{font-size:2rem;margin-bottom:4px;}
.header .title{font-size:1.2rem;font-weight:900;}
.header .sub{font-size:.78rem;color:var(--muted);margin-top:2px;}
.tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:20px;gap:4px;}
.tab{flex:1;text-align:center;padding:10px 4px;border-radius:8px;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;}
.tab.active{background:var(--accent);color:#fff;}
.page{display:none;}
.page.active{display:block;}
.input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-family:var(--sans);font-size:.92rem;outline:none;transition:border-color .2s;}
.input:focus{border-color:var(--accent);}
.input-group{margin-bottom:14px;}
.input-group label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;}
.required-star{color:var(--red);text-transform:none;}
.input-row{display:flex;gap:8px;align-items:flex-start;}
.input-row .input{flex:1;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:8px;border:none;font-family:var(--sans);font-size:.92rem;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:var(--accent2);}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-sm{padding:6px 12px;font-size:.78rem;border-radius:6px;}
.btn-full{width:100%;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;}
.csv-hint{font-size:.78rem;color:var(--muted);margin-bottom:16px;padding:10px 12px;background:var(--surface2);border-radius:8px;border-left:3px solid var(--accent);line-height:1.6;}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.72rem;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
.badge-green{background:rgba(34,197,94,.1);color:var(--green);border-color:rgba(34,197,94,.3);}
.runner-card-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:.95rem;}
.loading-cell{text-align:center;color:var(--muted);padding:30px 10px;font-size:.85rem;}
.qr-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;background:#fff;border-radius:12px;margin-top:12px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:.88rem;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transition:all .25s;z-index:9999;max-width:90vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.success{border-left:4px solid var(--green);}
.toast.error{border-left:4px solid var(--red);}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:700;}
/* ── 關於 Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:500;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:360px;max-width:92vw;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.about-title{font-size:1.1rem;font-weight:900;color:var(--accent);margin-bottom:16px;}
.about-row{display:flex;align-items:flex-start;padding:3px 0;font-size:.85rem;}
.about-row .about-label{width:80px;flex-shrink:0;color:var(--muted);}
.about-row .about-value{flex:1;color:var(--text);word-break:break-all;}
.about-row .about-value a{color:var(--accent);text-decoration:underline;}
.about-divider{height:1px;background:var(--border);margin:14px 0;}
/* ── 獎狀 ── */
.cert-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:600;padding:16px;overflow:auto;}
.cert-modal-box{background:#12141c;border-radius:16px;padding:16px;max-width:96vw;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.cert-scale-wrap{width:100%;overflow:auto;display:flex;justify-content:center;}
#certCanvas{display:block;max-width:100%;max-height:calc(100vh - 150px);width:auto;height:auto;border-radius:6px;}
.cert-loading{color:#c9cede;padding:60px 40px;text-align:center;font-size:.9rem;min-width:260px;}
.cert-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
@media print{
  body *{visibility:hidden;}
  .cert-modal-overlay, .cert-modal-overlay *{visibility:visible;}
  .cert-modal-overlay{position:fixed;inset:0;background:#fff;padding:0;display:flex;align-items:center;justify-content:center;}
  .cert-modal-box{box-shadow:none;background:#fff;padding:0;}
  .cert-scale-wrap{overflow:visible;}
  .cert-no-print{display:none!important;}
  #certCanvas{max-width:100vw;max-height:100vh;border-radius:0;}
  /* 紙張方向依獎狀是橫式或直式，列印前由 printAward() 動態設定 */
}
body.no-sys .tabs, body.no-sys .page{display:none!important;}
.sys-pick{display:block;padding:14px 16px;margin-top:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);text-decoration:none;font-weight:600;}
.sys-pick:hover{border-color:var(--accent);}
</style>

<div class="wrap">
  <div class="header">
    <div class="logo">🎫</div>
    <div class="title" id="sysName">活動報名系統</div>
    <div class="sub">參加者服務</div>
  </div>

  <div id="sysGate" class="card" style="display:none"></div>

  <div class="tabs">
    <div class="tab active" data-page="signup" onclick="showPage('signup')">📝 報名</div>
    <div class="tab" data-page="status" onclick="showPage('status')">🔍 查詢報名／修改</div>
    <div class="tab" data-page="lookup" onclick="showPage('lookup')">📋 報名紀錄</div>
  </div>
  <div style="display:flex;justify-content:flex-start;align-items:center;margin-bottom:12px">
    <a href="javascript:void(0)" onclick="showAbout()" style="font-size:.78rem;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">ℹ️ 關於</a>
  </div>

  <!-- ════════ 報名 ════════ -->
  <div id="page-signup" class="page active">
    <div id="signupContent">
      <div class="loading-cell">載入中...</div>
    </div>
  </div>

  <!-- ════════ 查詢報名結果 ════════ -->
  <div id="page-status" class="page">
    <div id="statusContent">
      <div class="loading-cell">載入中...</div>
    </div>
    <div id="statusResult"></div>
  </div>

  <!-- ════════ 查詢報名紀錄 ════════ -->
  <div id="page-lookup" class="page">
    <div class="card">
      <div class="csv-hint">ID 和身分證字號填寫其中一項即可，兩項都填寫時，符合任一項即可查詢。</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px">
        <div class="input-group" style="margin:0"><label>ID</label><input id="lookupId" type="text" class="input" placeholder="R0001" oninput="applyHalf(this)"></div>
        <div class="input-group" style="margin:0"><label>身分證字號</label><input id="lookupIdNum" type="text" class="input" placeholder="A123456789" oninput="applyHalf(this)"></div>
      </div>
      <div class="input-group"><label>生日（yyyy/mm/dd）<span class="required-star">*</span></label><div class="input-row"><input id="lookupBirthday" data-fmt="ymd" type="text" class="input" placeholder="1990/01/01" oninput="applyHalf(this)"><button type="button" class="btn btn-ghost btn-sm" onclick="var _d=document.getElementById('lookupBirthdayPicker');_d.showPicker?_d.showPicker():_d.click()">📅</button><input type="date" id="lookupBirthdayPicker" style="display:none" onchange="if(this.value){const[y,m,d]=this.value.split('-');document.getElementById('lookupBirthday').value=y+'/'+m+'/'+d;this.value=''}"></div></div>
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <div class="input-group" id="lookupEventRow" style="margin:0;flex:1;min-width:160px"><label>選擇活動</label><select id="lookupEventSelect" class="input"><option value="">請選擇活動...</option></select></div>
        <label style="display:flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer;white-space:nowrap;margin-top:18px">
          <input type="checkbox" id="lookupAllEvents" onchange="onLookupAllEventsChange()">
          歷次活動
        </label>
      </div>
      <button class="btn btn-primary btn-full" style="margin-top:8px" onclick="doLookup()">🔍 查詢報名紀錄</button>
    </div>
    <div id="lookupResult"></div>
  </div>

</div>

<div id="toast" class="toast"></div>

<script src="cf.js?v=1.8.6"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, query, orderBy, where, serverTimestamp, writeBatch, deleteField, runTransaction, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7a1puWKl5WYC19PUnh-Di7ra70e862I8",
  authDomain: "registration-system-6e296.firebaseapp.com",
  projectId: "registration-system-6e296",
  storageBucket: "registration-system-6e296.firebasestorage.app",
  messagingSenderId: "561912063653",
  appId: "1:561912063653:web:03fefeb99aa16885818f4c"
};
const app = initializeApp(firebaseConfig);
// App Check：確保呼叫Cloud Function的請求真的是從這個網頁發出的，擋掉繞過網頁畫面、
// 直接寫程式呼叫API的機器人。下面的佔位字串要換成 Firebase Console→App Check→
// 註冊應用程式（Fraud Defense／reCAPTCHA Enterprise 提供者）用的網站金鑰。
initializeAppCheck(app, {
  provider: new ReCaptchaEnterpriseProvider('RECAPTCHA_ENTERPRISE_SITE_KEY_PLACEHOLDER'),
  isTokenAutoRefreshEnabled: true
});
const db = getFirestore(app);
const auth = getAuth(app);
// Cloud Functions（報名交易處理部署在 asia-east1 台灣區域）
const functions = getFunctions(app, 'asia-east1');

// ── 報名系統（網址 ?s=系統代碼）──
// 每個系統各自獨立：自己的活動、參加者資料。這個頁面只顯示網址指定的系統。
const SYS=(new URLSearchParams(location.search).get('s')||'').trim().toLowerCase();
const SYS_RE=/^[a-z0-9][a-z0-9-]{1,29}$/;
// ── 系列（網址 &g=系列ID：只顯示這個系列的活動）──
// 活動選單依系列分組顯示；系列不存在（例如已刪除）就不篩選，顯示全部活動。
const SERIES_FILTER=(new URLSearchParams(location.search).get('g')||'').trim();
// ── 單一活動（網址 &e=活動ID：只顯示這個活動；簡易表單直接轉到填表畫面 form.html）──
const EVENT_FILTER=(new URLSearchParams(location.search).get('e')||'').trim().slice(0,100);
// 簡易表單的填表畫面網址（帶著系列，填表頁的「其他活動」才回得到同一個清單）
function simpleFormUrl(eid){ return 'form.html?s='+encodeURIComponent(SYS)+'&e='+encodeURIComponent(eid)+(SERIES_FILTER?'&g='+encodeURIComponent(SERIES_FILTER):''); }
// 單一活動網址指向簡易表單：直接轉過去（回傳 true＝已轉走）
async function redirectIfSimpleEvent(){
  if(!EVENT_FILTER) return false;
  try{
    const s=await getDoc(doc(db,'systems',SYS,'events',EVENT_FILTER));
    if(s.exists()&&s.data().type==='simple'){ location.replace(simpleFormUrl(EVENT_FILTER)); return true; }
  }catch(e){}
  return false;
}
let seriesMapP=null;
function loadSeriesMap(){
  if(!seriesMapP){
    seriesMapP=getDocs(collection(db,'systems',SYS,'series')).then(snap=>{
      const m={}; snap.docs.forEach(d=>{ m[d.id]={id:d.id,...d.data()}; }); return m;
    }).catch(()=>({}));
  }
  return seriesMapP;
}
// 依網址篩選活動：&e＝只留這個活動、&g＝只留這個系列。
// 簡易表單（type:'simple'）只出現在「報名」分頁的活動選單（opts.simple），選了會轉到填表畫面；
// 「查詢報名／修改」「報名紀錄」只有標準報名（簡易表單用修改碼在填表畫面查詢）
async function filterBySeries(list, opts){
  list=(list||[]).filter(ev=>ev.type!=='simple'||(opts&&opts.simple));
  if(EVENT_FILTER) return list.filter(ev=>ev.id===EVENT_FILTER);
  if(!SERIES_FILTER) return list;
  const sm=await loadSeriesMap();
  if(!sm[SERIES_FILTER]) return list;
  return list.filter(ev=>ev.seriesId===SERIES_FILTER);
}
// 活動 <option>：有系列時依系列分組（系列依後台排序，同系列新的一期在前），沒系列的放「其他活動」
async function eventOptionsHtml(list, selectedId, open, close){
  open=open||'（'; close=close||'）';
  const sm=await loadSeriesMap();
  const opt=ev=>'<option value="'+esc(ev.id)+'"'+(selectedId&&ev.id===selectedId?' selected':'')+'>'+esc((ev.type==='simple'?'📝 ':'')+ev.name+(ev.date?open+ev.date+close:''))+'</option>';
  const buckets=new Map();
  list.forEach(ev=>{ const k=(ev.seriesId&&sm[ev.seriesId])?ev.seriesId:''; if(!buckets.has(k))buckets.set(k,[]); buckets.get(k).push(ev); });
  const keys=[...buckets.keys()].filter(k=>k);
  if(!keys.length) return list.map(opt).join('');
  const ord=s=>typeof s.sortOrder==='number'?s.sortOrder:1e9;
  keys.sort((a,b)=>ord(sm[a])-ord(sm[b])||String(sm[a].name).localeCompare(String(sm[b].name),'zh-Hant'));
  let html=keys.map(k=>'<optgroup label="'+esc(sm[k].name||'')+'">'
    +buckets.get(k).slice().sort((a,b)=>(b.seriesNo||0)-(a.seriesNo||0)).map(opt).join('')+'</optgroup>').join('');
  if(buckets.has('')) html+='<optgroup label="其他活動">'+buckets.get('').map(opt).join('')+'</optgroup>';
  return html;
}
// 網址指定系列時，頁首副標題顯示系列名稱
async function applySeriesHeader(role){
  if(!SERIES_FILTER) return;
  const sm=await loadSeriesMap();
  const s=sm[SERIES_FILTER];
  if(s) document.querySelector('.header .sub').textContent=s.name+' · '+role;
}
// 呼叫後端時自動帶上系統代碼
function callFn(name){
  const fn=httpsCallable(functions,name);
  return data=>fn({...data,systemId:SYS});
}

// ── 匿名登入（使用者無感）──
// firestore.rules 現在要求所有讀寫至少要有登入身分，這裡在背景自動
// 取得匿名身分，參加者不需要註冊任何帳號。登入狀態會存在瀏覽器裡，
// 之後重新開啟頁面會直接沿用，不會每次都建立新帳號。
//
// ⚠️ 這裡故意不用「if(auth.currentUser) return; 否則 signInAnonymously()」
// 這種寫法：頁面剛載入時，Firebase 都還在背景非同步地從瀏覽器裡還原「先前
// 已經登入」的身分（例如同一瀏覽器另一分頁開著 admin.html 用管理員帳號
// 登入），這個還原動作還沒完成之前 auth.currentUser 會短暫是 null。
// 若直接判斷 null 就呼叫 signInAnonymously()，等於在管理員身分「正要」
// 被還原的那一瞬間硬塞進一個匿名身分，蓋掉同瀏覽器（同網域）其他分頁
// 原本的管理員登入狀態，導致 admin.html 被強制登出。
// 改用 onAuthStateChanged 等 Firebase 確定「目前到底有沒有人登入」之後，
// 沒有才補做匿名登入；已經有登入（不論是管理員或匿名）就直接沿用。
let ensureAuthPromise = null;
function ensureAuth(){
  if (!ensureAuthPromise) {
    ensureAuthPromise = new Promise((resolve, reject) => {
      const unsub = onAuthStateChanged(auth, async user => {
        unsub();
        if (user) { resolve(); return; }
        try { await signInAnonymously(auth); resolve(); }
        catch(e){ showToast('連線初始化失敗，請重新整理頁面：'+e.message,'error'); reject(e); }
      });
    });
  }
  return ensureAuthPromise;
}

// ── 邀請碼雜湊 ──
// 邀請碼在資料庫裡只存 SHA-256 雜湊（inviteCodeHash），不存明文——
// 組別文件是公開可讀的，存明文等於把邀請碼直接送給所有人。
// 驗證時把使用者輸入做同樣的雜湊再比對。
async function sha256Hex(text){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// 檢查這個組別是否設有邀請碼（新版存雜湊；相容還沒重新儲存過的舊資料明文）
function groupHasInvite(g){
  return !!(g&&((g.inviteCodeHash&&g.inviteCodeHash.trim())||(g.inviteCode&&g.inviteCode.trim())));
}
// 驗證邀請碼是否正確（優先比對雜湊，退回舊版明文）
async function checkInviteCode(g,input){
  const v=(input||'').trim();
  if(g.inviteCodeHash&&g.inviteCodeHash.trim()){
    return (await sha256Hex(v))===g.inviteCodeHash.trim();
  }
  return v===(g.inviteCode||'').trim();
}

// 自訂欄位的共用函式（顯示條件、區塊、複選、欄位畫面、esc）在 cf.js，三個頁面共用一份
// 組別排序：有 sortOrder 就依它排（管理員在後台手動排序過的結果），沒有的組別維持查詢回傳的原始順序
// （createdAt asc），不會因為缺欄位而消失或被排到奇怪的位置。跟 admin.html 共用同一套邏輯。
function sortGroupDocs(docs){
  return docs.slice().sort((a,b)=>{
    const ao=a.data().sortOrder, bo=b.data().sortOrder;
    if(typeof ao==='number'&&typeof bo==='number')return ao-bo;
    if(typeof ao==='number')return -1;
    if(typeof bo==='number')return 1;
    return 0;
  });
}
function escJs(v) {
  return String(v ?? '')
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 工具函式 ──
function toHalf(str) {
  if (!str) return str;
  return str.replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
            .replace(/　/g, ' ');
}
function applyHalf(el) {
  const v = toHalf(el.value);
  if (v !== el.value) { el.value = v; el.dispatchEvent(new Event('input')); }
}
window.toHalf = toHalf;
window.applyHalf = applyHalf;

function autoSlashDate(el) {
  const isDelete = el._lastLen !== undefined && el.value.length < el._lastLen;
  el._lastLen = el.value.length;
  if (isDelete) return;
  const pos = el.selectionStart;
  const raw = el.value;
  const digits = raw.replace(/\D/g, '').slice(0, 8);
  let out = digits;
  if (digits.length > 4) out = digits.slice(0,4) + '/' + digits.slice(4);
  if (digits.length > 6) out = digits.slice(0,4) + '/' + digits.slice(4,6) + '/' + digits.slice(6);
  if (out !== raw) {
    const slashesBeforeInRaw = (raw.slice(0, pos).match(/\//g) || []).length;
    const slashesBeforeInOut = (out.slice(0, pos).match(/\//g) || []).length;
    const newPos = Math.min(pos + (slashesBeforeInOut - slashesBeforeInRaw), out.length);
    el.value = out;
    el._lastLen = out.length;
    try { el.setSelectionRange(newPos, newPos); } catch(e) {}
  }
}
window.autoSlashDate = autoSlashDate;

// ── 全形→半形：統一監聽所有 input ──
document.addEventListener('input', function(e) {
  const el = e.target;
  const tag = el.tagName;
  const type = (el.type||'').toLowerCase();
  if (tag !== 'INPUT' && tag !== 'TEXTAREA') return;
  if (['checkbox','radio','file','date','datetime-local','time','color','range'].includes(type)) return;
  const v = toHalf(el.value);
  if (v !== el.value) {
    const pos = el.selectionStart;
    el.value = v;
    try { el.setSelectionRange(pos, pos); } catch(e) {}
  }
  if (el.dataset.fmt === 'ymd') autoSlashDate(el);
}, true);

function validateBirthday(v) {
  if (!v) return true; // 空值由呼叫端決定是否必填
  if (!/^\d{4}\/\d{2}\/\d{2}$/.test(v)) return false;
  const [y,m,d] = v.split('/').map(Number);
  const dt = new Date(y,m-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d) return false;
  if(y<1900) return false;
  const today=new Date(); today.setHours(0,0,0,0);
  if(dt>=today) return false; // 不能是今天或未來
  return true;
}
window.validateBirthday=validateBirthday;
function validatePhone(v) { if (!v) return true; return /^09\d{8}$/.test(v); }
function validateEmail(v) {
  if (!v) return true;
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}
function validateId(v) {
  if (!v) return true;
  return /^[A-Za-z]\d{9}$/.test(v);
}
function setFieldError(id, hasError) {

// qrcodejs 對多位元組(中文)字元處理有bug，需先轉換為UTF-8位元組序列
function utf16to8(str){
  let out='';
  for(let i=0;i<str.length;i++){
    const c=str.charCodeAt(i);
    if(c>=0x0001&&c<=0x007F){
      out+=str.charAt(i);
    }else if(c>0x07FF){
      out+=String.fromCharCode(0xE0|((c>>12)&0x0F));
      out+=String.fromCharCode(0x80|((c>>6)&0x3F));
      out+=String.fromCharCode(0x80|((c>>0)&0x3F));
    }else{
      out+=String.fromCharCode(0xC0|((c>>6)&0x1F));
      out+=String.fromCharCode(0x80|((c>>0)&0x3F));
    }
  }
  return out;
}
function makeQRCode(el,text,size){
  el.innerHTML='';
  new QRCode(el,{text:utf16to8(text),width:size,height:size});
}

// 判斷參加者報名是否開放（OR 邏輯：任一條件符合即開放）
function isRunnerRegOpen(ev, entryCount) {
  const now = Date.now();
  // 條件1：手動開關 ON → 一律可報名
  if (ev.registrationOpen) return true;
  // 未手動開放：須設定報名期間（開始、結束至少一個），且「在期間內」「人數未滿」才能報名
  // 沒有設定報名期間＝不開放報名；只設一端的話，另一端不限制
  const start = ev.registrationStartAt?.toDate?.()?.getTime() ?? null;
  const end   = ev.registrationEndAt?.toDate?.()?.getTime() ?? null;
  if (start === null && end === null) return false;
  const afterStart = (start === null || now >= start);
  const beforeEnd  = (end   === null || now <= end);
  const inTimeRange = afterStart && beforeEnd;
  // 人數上限：0 或未設定視為不限制（通過）
  const cap = ev.registrationCapacity ?? 0;
  const underCapacity = (cap === 0 || entryCount < cap);
  return inTimeRange && underCapacity;
}

// 產生報名資訊說明文字（顯示在活動資訊卡）
function buildRegInfoHtml(ev, entryCount) {
  const fmtDT = ts => {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  };
  const lines = [];
  if (ev.registrationStartAt) lines.push('報名開始：' + fmtDT(ev.registrationStartAt));
  if (ev.registrationEndAt)   lines.push('報名截止：' + fmtDT(ev.registrationEndAt));
  const cap = ev.registrationCapacity ?? 0;
  const showCapacity = ev.showCapacity !== false;
  const mode = ev.entryCountDisplay || 'threshold';
  const threshold = ev.entryCountThreshold ?? 0;
  let showCount;
  if (mode === 'hidden') showCount = false;
  else if (mode === 'capOnly') showCount = cap > 0;
  else showCount = entryCount >= threshold; // 'threshold'：0＝一律顯示
  if (showCount) lines.push('已報名人數：' + entryCount);
  if (showCapacity && cap > 0) lines.push('報名總人數上限：' + cap);
  return lines.length ? lines.map(l=>'<div style="font-size:.75rem;color:var(--muted);margin-top:3px">'+l+'</div>').join('') : '';
}

async function initSignupPage(){
  signupEvents=[];
  const content=document.getElementById('signupContent');
  content.innerHTML='<div class="card"><div class="loading-cell">載入中...</div></div>';
  // 取得所有活動，由前端做開放判斷
  const snap=await getDocs(query(collection(db,'systems',SYS,'events'), orderBy('createdAt','desc')));
  const openEvents=[];
  for(const d of snap.docs){
    const ev={id:d.id,...d.data()};
    if(ev.type==='simple'){ if(isRunnerRegOpen(ev,0)) openEvents.push(ev); continue; } // 簡易表單：名額由後端管，這裡只看開放時間
    // 取目前報名人數：用聚合計數查詢，只回傳數字、不下載整個報名集合
    const countSnap=await getCountFromServer(collection(db,'systems',SYS,'events',d.id,'runners'));
    ev._entryCount = countSnap.data().count;
    if(isRunnerRegOpen(ev, ev._entryCount)) openEvents.push(ev);
  }
  signupEvents=await filterBySeries(openEvents,{simple:true});
  if(!signupEvents.length){
    content.innerHTML='<div class="card"><div class="loading-cell">'+(EVENT_FILTER?'這個活動目前沒有開放報名。<div style="margin-top:10px"><a href="member.html?s='+encodeURIComponent(SYS)+'" style="color:var(--accent)">看其他活動</a></div>':'目前沒有開放報名的活動')+'</div></div>';
    return;
  }
  if(signupEvents.length===1){
    await selectSignupEvent(signupEvents[0].id);
  } else {
    let html='<div class="card"><div class="input-group"><label>選擇活動</label><select id="signupEventSelect" class="input" onchange="onSignupEventSelect()">';
    html+='<option value="">請選擇...</option>';
    html+=await eventOptionsHtml(signupEvents,lastSignupEventId);
    html+='</select></div></div><div id="signupForm"></div>';
    content.innerHTML=html;
    if(lastSignupEventId&&signupEvents.find(e=>e.id===lastSignupEventId)){
      await selectSignupEvent(lastSignupEventId, true);
    }
  }
}
window.onSignupEventSelect=async function(){
  const id=document.getElementById('signupEventSelect').value;
  if(!id){document.getElementById('signupForm').innerHTML='';return;}
  const ev=signupEvents.find(e=>e.id===id);
  if(ev&&ev.type==='simple'){ location.href=simpleFormUrl(id); return; } // 選了簡易表單：到填表畫面
  await selectSignupEvent(id, true);
}

      +'<a class="btn btn-primary btn-full" style="margin-top:14px;text-decoration:none" href="'+esc(simpleFormUrl(eventId))+'">前往填表 →</a></div>';

// 參加者號碼欄位：依目前選到的組別（有開啟自訂號碼規則就依組別，沒開啟就依活動）決定
// 顯示/隱藏、標籤上的範圍提示、輸入框 placeholder。組別切換時呼叫一次。
// ── 優先沿用／固定沿用：填完姓名、性別、生日（與手機、Email、身分證）就比對，帶出上一期的號碼 ──
// 對到相似的人時當場確認是不是同一人；確認的結果送出時一起帶上，不會再問一次
// 比對用的關鍵資料改了才重新比對（手機、Email 改了不重問；送出時伺服器會再確認比對對象沒變）
const bibPreKey=pr=>[pr.name,pr.gender,pr.birthday,pr.idNumber].join('|');
function newBibPre(){ return {key:'',own:'',ownIn:{},identity:null,done:false}; } // ownIn：組別 ID → 舊號碼在那個組別能沿用時要填的數字（伺服器判斷）
let suBibPre=newBibPre();
const bibLookupTimers={};
function bibLookupProfile(get){
  return {name:get('name'),gender:get('gender'),birthday:get('birthday'),phone:get('phone'),email:get('email'),idNumber:get('idNumber').toUpperCase()};
}
// 共用：比對並把結果寫進 pre（pre 是 suBibPre 或多人報名某一位的狀態）；who＝確認框標題用
async function runBibLookup(ev,pr,pre,who){
  if(!ev||bibModeOf(ev)==='none') return false;
  if(!pr.name||!pr.gender||!validateBirthday(pr.birthday)) return false;
  const key=bibPreKey(pr);
  if(key===pre.key) return false;
  Object.assign(pre,newBibPre(),{key});
  try{
    let idq={};
    let res=(await callFn('bibLookup')({eventId:ev.id,...pr})).data;
    // 找到同姓名、同性別、同生日的人：當場確認身分（答案送出報名時一起帶上，不會再問一次）
    while(res.status==='needs-identity'){
      if(key!==pre.key) return false;
      const nx=await askIdentity(res.step,idq,who);
      if(key!==pre.key) return false;
      if(!nx){ pre.done=true; return false; } // 取消：先不帶號碼，送出報名時會再確認
      idq=nx;
      res=(await callFn('bibLookup')({eventId:ev.id,...pr,identity:idq})).data;
    }
    pre.identity=idq;
    if(key!==pre.key) return false;
    pre.own=String(res.oldBib||''); pre.ownIn=res.ownIn||{}; pre.done=true; // 舊號碼：完整號碼（例如 A015），原樣沿用；能不能在各組沿用由伺服器判斷
    return true;
  }catch(e){ pre.key=''; if(/ID/.test(e.message||'')) showToast(e.message,'error'); return false; }
}
// 號碼欄位下方的說明（固定沿用不顯示號碼欄位，只顯示這段）。gid＝目前選的組別（''＝沒有組別）
function bibPreInfoHtml(ev,pre,gid){
  const mode=bibModeOf(ev);
  if(mode==='none') return '';
  if(pre.own){
    // 舊號碼（完整號碼）要在這個組別的號碼集合裡：伺服器查舊號碼時一併判斷好各組別能不能沿用
    if(!(pre.ownIn||{})[gid||'']) return '<span style="color:var(--red)">你的號碼 '+esc(pre.own)+' 不在這個組別的號碼範圍內'+(mode==='fixed'?'，本期不能報名這個組別':'，會改配這個組別的號碼')+'</span>';
    return '✅ 你的號碼是 <strong class="mono">'+esc(pre.own)+'</strong>，本期'+(mode==='fixed'?'固定沿用':(ev.bibOldCanChange===true?'優先沿用（留空或保留就會沿用，也可以換）':'沿用，不能換號碼'));
  }
  if(mode==='fixed') return pre.done?'<span style="color:var(--red)">本期只開放已有號碼的成員報名，查無你的號碼</span>':'本期號碼固定沿用：填完姓名、性別、生日後會顯示你的號碼';
  return '';
}
// 把舊號碼填進號碼欄（欄位空白、或先前是自動帶入的才填，參加者自己改過就不動）
// lock：優先沿用但舊成員不能換號碼 → 號碼欄鎖住只顯示原號碼
// 舊號碼在這個組別的號碼集合裡才填進去（伺服器判斷）；不在集合裡就不沿用（固定沿用不能報這組，優先沿用改配）
function fillBibInput(inputId,pre,gid,lock){
  const digits=(pre.ownIn||{})[gid||'']||'';
  const el=document.getElementById(inputId); if(!el) return;
  const locked=!!(lock&&digits);
  el.readOnly=locked;
  const pickBtn=el.parentElement&&el.parentElement.querySelector('button'); if(pickBtn) pickBtn.disabled=locked;
  if(locked){ el.value=digits; el.dataset.auto='1'; return; }
  if(digits){
    if(el.value.trim()===''||el.dataset.auto==='1'){ el.value=digits; el.dataset.auto='1'; }
  }else if(el.dataset.auto==='1'){ el.value=''; el.dataset.auto=''; }
}
function fromMemberInfoHtml(label,edit){

    +(edit?'；換到這個組別或改了'+esc(label)+'，號碼會跟著換':'')+'</div>';

window.scheduleSignupBibLookup=function(){

// ── 組別欄位設定（活動 fieldSettings.group）──
// show：是否顯示組別；required：是否必選。活動沒有任何組別時一律不顯示。舊活動沒設定＝顯示且必選。
function groupFieldCfg(ev, groupCount){

// 組別下拉選單：一律先顯示「請選擇...」，必選時要真的選了才能送出；選填時「請選擇（可不選）」＝不選組別；

  hint.style.whiteSpace='pre-line';

// 依目前填寫的生日判斷是否需要顯示家長聲明區塊，並更新模組變數 curSignupNeedsParental
window.updateParentalBlock=function updateParentalBlock(){
  const group=document.getElementById('suGroup')?.value;
  const g=window._signupGroupMap?.[group];
  const block=document.getElementById('suParentalBlock');
  if(!block)return;
  const pAge=effParentalAge(curSignupEvent,g); // 活動或組別任一個門檻
  if(!(pAge>0)){curSignupNeedsParental=false;block.style.display='none';return;}
  const birthday=document.getElementById('suBirthday')?.value.trim();
  if(birthday&&validateBirthday(birthday)){
    const evDate=curSignupEvent?.date||new Date().getFullYear()+'-01-01';
    const age=calcAgeRunner(birthday,evDate);
    // 算不出年齡（日期異常）時保守隱藏——伺服器端會用權威資料做最終判斷
    if(age===null||age>=pAge){curSignupNeedsParental=false;block.style.display='none';return;}
    curSignupNeedsParental=true;block.style.display='';
  }else{
    curSignupNeedsParental=false;block.style.display='none';
  }
}

window.calcAgeRunner=function calcAgeRunner(birthday,eventDate){
  if(!birthday||!eventDate)return null;
  const [by,bm,bd]=birthday.split(/[/-]/).map(Number);
  const [ey,em,ed]=eventDate.split(/[/-]/).map(Number);
  if(!by||!ey)return null;
  let age=ey-by;
  if(em<bm||(em===bm&&ed<bd))age--;
  return age;
}

// ── 自選號碼的有效範圍：最小值/最大值各自獨立判斷——有填就用填的值，
// 沒填的那一個用「位數」推算的預設（最小1，最大例如3位＝999），
// 兩個可以只填其中一個（例如只填最小值100＝範圍100~999），跟後台 Cloud Function 的驗證邏輯一致 ──
// ── 編號格式：前綴＋補零數字＋後綴（跟後端 getEffectiveBibConfig 的 fmt／parse 一致）──
// bibAffix：依輸入框 id 記住目前適用的前後綴（報名表單、修改表單、多人報名每一位各自不同）
const bibAffix={};
function bibStr(n,pad,inputId){ const a=bibAffix[inputId]||{}; return (a.prefix||'')+String(n).padStart(pad,'0')+(a.suffix||''); }
// 取出數字部分：可以只打數字，也可以連前後綴一起打（大小寫不拘）；不合格回傳 NaN
function bibParseCfg(raw,a){
  a=a||{}; let t=String(raw||'').trim().toUpperCase();
  const pad=a.pad||0;
  const P=(a.prefix||'').toUpperCase(), X=(a.suffix||'').toUpperCase();
  // 純數字的前後綴會跟號碼混在一起：只有拿掉後剩下的位數夠多才當成前後綴（跟後端一致）
  if(P&&t.startsWith(P)&&(!/^\d+$/.test(P)||t.length-P.length-(X&&t.endsWith(X)?X.length:0)>=pad)) t=t.slice(P.length);
  if(X&&t.endsWith(X)&&(!/^\d+$/.test(X)||t.length-X.length>=pad)) t=t.slice(0,-X.length);
  return /^\d{1,12}$/.test(t)?parseInt(t,10):NaN;
}
function bibNumOf(raw,inputId){ return bibParseCfg(raw,bibAffix[inputId]); }
// 編號模式（只在活動屬於系列時有作用）：none 不須沿用／prefer 優先沿用／fixed 固定沿用
function bibModeOf(ev){ return (ev&&ev.seriesId&&['prefer','fixed'].includes(ev.bibMode))?ev.bibMode:'none'; }
// 輸入框左右的前後綴文字
function bibAffixWrap(inputHtml,inputId){
  return '<span id="'+inputId+'_pre" class="mono" style="font-weight:700;color:var(--muted)"></span>'+inputHtml+'<span id="'+inputId+'_suf" class="mono" style="font-weight:700;color:var(--muted)"></span>';
}
function setBibAffix(inputId,cfg){
  bibAffix[inputId]={prefix:cfg.prefix||'',suffix:cfg.suffix||'',pad:cfg.pad||3};
  const pre=document.getElementById(inputId+'_pre'), suf=document.getElementById(inputId+'_suf');
  if(pre) pre.textContent=cfg.prefix||''; if(suf) suf.textContent=cfg.suffix||'';
}
// ── 報名限制：活動層級＋組別都要符合（跟後端 checkRegLimits 一致）──
// ── 報名限制（性別、年齡、家長陪同、邀請碼）：活動或組別「二選一」，不合併 ──
// 組別勾了「此組別自訂報名限制」（limitOverride:true）→ 只用組別的限制；沒勾 → 只用活動的限制。
// 舊資料沒有 limitOverride：組別有設任何限制就當作自訂（維持組別限制有效），都沒設就沿用活動。
// 組別名額（groupCapacity）、活動總名額不在這裡，兩個都一直有效。
const LIMIT_KEYS=['genderLimit','ageMin','ageMax','parentalAge'];
function groupLimitOverride(g){
  if(!g) return false;
  if(typeof g.limitOverride==='boolean') return g.limitOverride;
  return LIMIT_KEYS.some(k=>g[k])||groupHasInvite(g);
}
function limitSource(ev,g){ return groupLimitOverride(g)?{o:g,who:'此組別'}:{o:ev||{},who:'此活動'}; }
function effParentalAge(ev,g){ return limitSource(ev,g).o.parentalAge||0; }
function inviteTarget(ev,g){ const o=limitSource(ev,g).o; return groupHasInvite(o)?o:null; }
// 修改報名換組別：新組別要邀請碼、而且跟原本的不是同一組邀請碼才要填（跟後端 checkInviteOnMove 一致）；回傳要比對的設定或 null
function inviteSigR(o){ return groupHasInvite(o)?((o.inviteCodeHash||'').trim()||('plain:'+String(o.inviteCode||'').trim())):''; }
function inviteNeededOnMove(ev,oldG,newG,oldId,newId){
  if((oldId||'')===(newId||'')) return null;
  const no=limitSource(ev,newG).o;
  if(!groupHasInvite(no)) return null;
  return inviteSigR(limitSource(ev,oldG).o)===inviteSigR(no)?null:no;
}
// ── 會員編號（報名限制的一種；比對在伺服器做，名單不會傳到瀏覽器）──
// 限會員／臨時編號要填編號；排除會員不用填（名單內的人送出時會被擋）
const MEMBER_MODES_R=['member','exclude','temp'];
function memberRuleR(ev,g){
  const {o,who}=limitSource(ev||{},g);
  const mode=MEMBER_MODES_R.includes(o.memberMode)?o.memberMode:'';
  const label=String(o.memberLabel||'').trim().slice(0,20)||(mode==='temp'?'臨時編號':'會員編號');
  return {mode,label,who};
}
const memberNeedsInput=r=>r.mode==='member'||r.mode==='temp';
function memberFieldHtml(id,val){
  return '<div class="input-group" id="'+id+'Row" style="display:none"><label><span id="'+id+'Label">會員編號</span> <span class="required-star">*</span></label>'
    +'<input id="'+id+'" type="text" class="input" maxlength="40" value="'+esc(val||'')+'" oninput="applyHalf(this)">'
    +'<div id="'+id+'Hint" style="font-size:.72rem;color:var(--muted);margin-top:4px"></div></div>';
}
function refreshMemberField(id,ev,g){
  const r=memberRuleR(ev,g); const row=document.getElementById(id+'Row'); if(!row) return r;
  row.style.display=memberNeedsInput(r)?'':'none';
  document.getElementById(id+'Label').textContent=r.label;
  document.getElementById(id+'Hint').textContent=r.mode==='member'?'系統會比對'+r.label+'和姓名、性別、生日':r.mode==='temp'?'請填主辦單位提供的'+r.label+'，每個號碼只能報名一次':'';
  return r;
}
function regLimitError(ev,g,gender,birthday,evDate){
  const {o,who}=limitSource(ev,g);
  if(o.genderLimit&&gender&&o.genderLimit!==gender) return who+'限'+o.genderLimit+'性報名';
  if(birthday&&evDate){
    const age=calcAgeRunner(birthday,evDate);
    if(age!==null){
      if(o.ageMin>0&&age<o.ageMin) return who+'年齡限制 '+o.ageMin+' 歲以上（您的年齡：'+age+'歲）';
      if(o.ageMax>0&&age>o.ageMax) return who+'年齡限制 '+o.ageMax+' 歲以下（您的年齡：'+age+'歲）';
    }
  }
  return '';
}
// 組別說明裡的「此組別限制」：自訂報名限制的組別列出它自己的限制；組別名額一律列出
function groupLimitHints(g){
  const h=groupLimitOverride(g)?limitHintList(g).filter(x=>x!=='需要邀請碼'):[];
  if(g&&g.groupCapacity>0) h.push('限'+g.groupCapacity+'人');
  return h;
}
function limitHintList(o){
  const h=[]; o=o||{};
  if(o.genderLimit)h.push('限'+o.genderLimit+'性');
  if(o.ageMin>0)h.push(o.ageMin+'歲以上');
  if(o.ageMax>0)h.push(o.ageMax+'歲以下');
  if(o.parentalAge>0)h.push(o.parentalAge+'歲以下須家長陪同聲明');
  if(groupHasInvite(o))h.push('需要邀請碼');
  const mr=memberRuleR(o,null);
  if(mr.mode==='member')h.push('限會員（需填'+mr.label+'）');
  else if(mr.mode==='exclude')h.push('不開放會員名單內的人員報名');
  else if(mr.mode==='temp')h.push('需填'+mr.label);
  return h;
}
function bibEffRange(rMin,rMax,pad){
  return {min:rMin>0?rMin:1, max:rMax>0?rMax:(Math.pow(10,pad)-1)};
}
// 參加者自選（報名自選號碼／參加者自助改號碼）的有效範圍：優先用「自訂號碼範圍」，
// 沒設自訂範圍就退回用「號碼範圍」，兩個都沒設才用位數上限——三層各自獨立判斷（最小/最大分開）
function resolveSelfSelectBibRange(customMin,customMax,generalMin,generalMax,pad){
  const general=bibEffRange(generalMin,generalMax,pad);
  return {min:customMin>0?customMin:general.min, max:customMax>0?customMax:general.max};
}
// 依組別解析「有效」號碼設定：組別有開啟「自訂號碼規則」(bibOverride) 就用組別自己的設定，
// 沒開啟就退回活動設定。位數固定用活動層級，不受組別影響。
// evOverride：選填，不傳就用目前報名表單的 curSignupEvent（自助改號碼那裡查的是別的活動文件，會自己傳進來）。
function getEffBibSettings(g,evOverride){
  const ev=evOverride||curSignupEvent||{};
  const pad=ev.bibPadLength||3;
  const useGroup=!!(g&&g.bibOverride);
  const allowCustomBib=useGroup?!!g.allowCustomBib:!!ev.allowCustomBib;
  const allowBibChange=useGroup?!!g.allowBibChange:!!ev.allowBibChange;
  const rMin=useGroup?(g.bibRangeMin||0):(ev.bibRangeMin||0);
  const rMax=useGroup?(g.bibRangeMax||0):(ev.bibRangeMax||0);
  const cMin=useGroup?(g.customBibRangeMin||0):(ev.customBibRangeMin||0);
  const cMax=useGroup?(g.customBibRangeMax||0):(ev.customBibRangeMax||0);
  const {min,max}=resolveSelfSelectBibRange(cMin,cMax,rMin,rMax,pad);
  const prefix=String((useGroup?g.bibPrefix:ev.bibPrefix)||''), suffix=String((useGroup?g.bibSuffix:ev.bibSuffix)||'');
  const note=String((useGroup?g.bibNote:ev.bibNote)||'');
  const auto=bibEffRange(rMin,rMax,pad);
  // 編號使用會員編號及臨時編號：開關打開、而且報名限制是「限會員」或「臨時編號」並選了名單 → 號碼就是編號（回傳編號名稱；沒作用＝''）
  const mr=memberRuleR(ev,g);
  const fromMember=((useGroup?g.bibFromMember:ev.bibFromMember)===true&&memberNeedsInput(mr)&&!!limitSource(ev,g).o.memberListId)?mr.label:'';
  return {pad,allowCustomBib,allowBibChange,min,max,prefix,suffix,note,autoMin:auto.min,autoMax:auto.max,fromMember};
}

function setBibHint(inputId,hintId,ok,html){

// 檢查號碼欄位填的號碼（失焦時、送出前）：回傳 {ok, bib, message}；oldBib＝修改報名原本的號碼（沒換就不檢查）
async function checkBibInput(inputId,hintId,oldBib){
  const el=document.getElementById(inputId); if(!el) return {ok:true,bib:''};
  const raw=el.value.trim();
  if(!raw||(oldBib&&raw===oldBib)){ setBibHint(inputId,hintId,null,''); return {ok:true,bib:raw?oldBib:''}; }
  let r;
  try{ r=await bibPoolCall(inputId,{action:'check',bib:raw}); }catch(e){ setBibHint(inputId,hintId,null,''); return {ok:true,bib:'',offline:true}; } // 連不上就交給送出時判斷
  if(!r.ok){ setBibHint(inputId,hintId,false,'<span style="color:var(--red)">❌ '+esc(r.message)+'</span>'); return r; }
  if(r.keep){ setBibHint(inputId,hintId,null,''); return r; }
  const own=(bibCtxByInput[inputId]||{}).own||'';
  setBibHint(inputId,hintId,true,'<span style="color:var(--green)">✅ 號碼 '+esc(r.bib)+(r.own?' 是你原本的號碼':' 可使用')+'</span>'
    +(own&&!r.own?'<div style="color:var(--muted)">主辦單位建議沿用你原本的號碼 '+esc(own)+'</div>':''));
  return r;
}
// 可用號碼＝0時，把值還原成安全狀態＋提示，但不 disable 欄位——因為修改報名時「留空自動配」跟
// 「維持原本編號」都是合法選項，硬鎖住欄位會讓使用者卡在其中一個選項
function lockBibFieldIfExhausted(L,inputId,hintId){
  if(L.total>0||L.own) return false;
  const el=document.getElementById(inputId);
  if(el){ if(el.value.trim()!=='') el.value=el.dataset.oldBib||''; el.style.borderColor=''; el.placeholder='此範圍號碼已全部被使用'; }
  setBibHint(inputId,hintId,null,'<span style="color:var(--red)">❌ 此範圍（'+esc(L.min)+'～'+esc(L.max)+'）號碼已全部被使用，請留空由系統自動配號</span>');
  return true;
}

async function checkBibExhaustedFor(inputId,hintId){
  const el=document.getElementById(inputId);

}

  if(L.kind==='new'){

      +'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">'+L.nums.map(btn).join('')+'</div>'
      +'<button type="button" class="btn btn-sm btn-ghost" onclick="moreAvailableBibs(\''+inputId+'\',\''+hintId+'\',\''+panelId+'\','+(L.next||0)+')">'+(L.next?'換一批 ⟳':'已顯示到範圍尾端，回到開頭 ⟳')+'</button>';
  }else if(L.kind==='old'){
    html+='<div style="font-size:.78rem;color:var(--muted);margin-bottom:6px">新號碼已用完，目前開放較早期成員用過的號碼：</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+L.nums.map(btn).join('')+'</div>';
  }else{
    html+='<div style="font-size:.8rem;color:var(--muted)">自選範圍內已經沒有號碼可選，請留空由系統自動配號</div>';
  }
  panel.innerHTML=html;
}

// Turnstile 明確渲染：等api.js真的載入完成才呼叫render()，並記住widgetId供之後reset用。
// 每次報名表單重新建立（換活動/換組別重繪）都要重新render一次，因為舊的container已經被換掉了。
let currentTurnstileToken='';
let turnstileWidgetId=null;
window.onTurnstileToken=function(token){ currentTurnstileToken=token; };
function renderTurnstileWidget(containerId){
  currentTurnstileToken='';
  turnstileWidgetId=null;
  const tryRender=()=>{
    const el=document.getElementById(containerId);
    if(!el)return; // 使用者已經切換到別的畫面，這個container不存在了，不用再等
    if(typeof turnstile==='undefined'){ setTimeout(tryRender,200); return; }
    el.innerHTML='';
    turnstileWidgetId=turnstile.render('#'+containerId,{
      sitekey:'0x4AAAAAAGF_-tn4QuUo4Giu',
      callback:onTurnstileToken,
    });
  };
  tryRender();
}
function resetTurnstileWidget(){
  currentTurnstileToken='';
  if(typeof turnstile!=='undefined'&&turnstileWidgetId!==null) turnstile.reset(turnstileWidgetId);
}
function waitForFreshTurnstileToken(timeoutMs=8000){
  return new Promise(resolve=>{
    const start=Date.now();
    (function check(){
      if(currentTurnstileToken){resolve(currentTurnstileToken);return;}
      if(Date.now()-start>timeoutMs){resolve('');return;}
      setTimeout(check,100);
    })();
  });
}

    +(o.html||'')

    +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'+btns+'</div></div>';
  document.body.appendChild(dlg);
  const inp=dlg.querySelector('#idDlgInput');

  if(!gender){showToast('請選擇性別','error');return;}
  if(!birthday){setFieldError('suBirthday',true);showToast('請填寫生日','error');return;}
  if(!/^\d{4}\/\d{2}\/\d{2}$/.test(birthday)){setFieldError('suBirthday',true);showToast('生日格式錯誤（yyyy/mm/dd）','error');return;}
  {
    const [by,bm,bd]=birthday.split('/').map(Number);
    const dt=new Date(by,bm-1,bd);
    const today=new Date();today.setHours(0,0,0,0);
    if(dt.getFullYear()!==by||dt.getMonth()!==bm-1||dt.getDate()!==bd){setFieldError('suBirthday',true);showToast('生日日期不存在','error');return;}
    if(dt>=today){setFieldError('suBirthday',true);showToast('生日不能是今天或未來日期','error');return;}
    if(by<1900){setFieldError('suBirthday',true);showToast('生日年份不合理','error');return;}
  }
  if(fs.phone?.show!==false){
    if(fs.phone?.required&&!phone){setFieldError('suPhone',true);showToast('請填寫手機號碼','error');return;}
    if(phone&&!validatePhone(phone)){setFieldError('suPhone',true);showToast('手機號碼格式錯誤（09開頭10碼）','error');return;}
  }
  if(fs.email?.show!==false){
    if(fs.email?.required&&!email){setFieldError('suEmail',true);showToast('請填寫 E-Mail','error');return;}
    if(!validateEmail(email)){setFieldError('suEmail',true);showToast('請填寫正確的Email格式','error');return;}
  }
  if(fs.idNumber?.show!==false){
    if(fs.idNumber?.required&&!idNumber){setFieldError('suIdNumber',true);showToast('請填寫身分證字號','error');return;}
    if(!validateId(idNumber)){setFieldError('suIdNumber',true);showToast('請填寫正確的身分證字號格式','error');return;}
  }

  // 組別限制驗證
  const inviteInput=document.getElementById('suInviteCode')?.value.trim()||'';
  const g=window._signupGroupMap?.[group];
  const suGroupHintEl=document.getElementById('suGroupHint');
  const failGroup=(msg)=>{
    if(suGroupHintEl){suGroupHintEl.textContent=msg;suGroupHintEl.style.color='var(--red)';}
    showToast(msg,'error');
  };
  // 會員編號：比對名單在伺服器做，這裡只檢查有沒有填
  const memberRule=memberRuleR(curSignupEvent,g);
  const memberNo=memberNeedsInput(memberRule)?(document.getElementById('suMemberNo')?.value.trim()||''):'';
  if(memberNeedsInput(memberRule)&&!memberNo){setFieldError('suMemberNo',true);showToast('請填寫'+memberRule.label,'error');return;}
  setFieldError('suMemberNo',false);
  {
    const limErr=regLimitError(curSignupEvent,g,gender,birthday,curSignupEvent?.date||'');
    if(limErr){failGroup(limErr);return;}
    const invT=inviteTarget(curSignupEvent,g);
    if(invT&&!(await checkInviteCode(invT,inviteInput))){failGroup('邀請碼不正確');return;}
    // 家長陪同聲明：送出前即時重算（依目前的組別＋生日），
    // 不依賴可能殘留的旗標
    updateParentalBlock();
    if(curSignupNeedsParental){
      const consent=document.getElementById('suParentalConsent');
      const parentName=document.getElementById('suParentName')?.value.trim()||'';
      const parentPhone=document.getElementById('suParentPhone')?.value.trim()||'';
      if(!consent?.checked){showToast('請勾選家長陪同聲明','error');return;}
      if(!parentName){showToast('請填寫緊急聯絡人姓名','error');return;}
      if(!parentPhone||!validatePhone(parentPhone)){showToast('請填寫正確的緊急聯絡人手機','error');return;}
    }
    // 組別名額
    if(g&&g.groupCapacity>0){
      const capSnap=await getCountFromServer(query(collection(db,'systems',SYS,'events',curSignupEvent.id,'runners'),where('groupId','==',group)));
      if(capSnap.data().count>=g.groupCapacity){failGroup('此組別已額滿（'+g.groupCapacity+'人）');return;}
    }
  }

  // 自訂欄位必填驗證 + 收集（只處理「適用此組別」的欄位，其餘已隱藏、不驗證也不送出）
  const customData={};
  const suVis=refreshSignupCf();
  { const r=cfCollect(curSignupCustomFields, 'su_cf_', suVis, {onDate:curSignupEvent?.date||''}); if(r.error){showToast(r.error,'error');return;} Object.assign(customData, r.data); }

  const runnerData={name,gender,birthday,phone,email,idNumber,note};

  // 收集家長陪同資料（curSignupNeedsParental 已在上方即時重算過）
  const parentalDataForSet=(()=>{
    if(!curSignupNeedsParental)return{};
    const agreed=document.getElementById('suParentalConsent')?.checked||false;
    if(!agreed)return{};
    return{parentalConsentAgreed:true,parentName:document.getElementById('suParentName')?.value.trim()||'',parentPhone:document.getElementById('suParentPhone')?.value.trim()||''};
  })();
  // update 用版（隱藏時帶 deleteField，用於 updateDoc 已報名更新）
  const parentalDataForUpdate=curSignupNeedsParental
    ?parentalDataForSet
    :{parentalConsentAgreed:deleteField(),parentName:deleteField(),parentPhone:deleteField()};

  // 自選號碼（若開放且有填）
  const customBibEl=document.getElementById('suBib');
  // 欄位沒顯示（沒開放自選、固定沿用、號碼使用會員編號）就不送：可能是換組別前留下的值
  const customBibRaw=(customBibEl&&document.getElementById('suBibRow')?.style.display!=='none')?customBibEl.value.trim():'';
  let customBib='';
  // 填了號碼：送出前問伺服器號碼池確認一次（跟送出報名同一套判斷；失焦檢查只是輔助）
  if(customBibRaw){
    setSignupBibCtx();
    const r=await checkBibInput('suBib','suBibHint','');
    if(!r.ok){ showToast('號碼：'+r.message,'error'); return; }
    customBib=r.bib||customBibRaw;
  }

  try{
    // ══════════════════════════════════════════════════════════
    // 報名的所有「真正的檢查與寫入」已搬進 Cloud Function
    // （functions/index.js 的 runnerSignup），在伺服器端以原子交易處理：
    //   - 比對現有參加者（個資不再下載到瀏覽器）
    //   - 名額 / 邀請碼 / 年齡性別限制（無法被繞過，名額不會超收）
    //   - 重複報名檢查、流水號與號碼配發（不會撞號）
    // 上面的前端檢查只是使用體驗的預檢，把關以伺服器為準。
    // ══════════════════════════════════════════════════════════
    // 送出前確認資料
    btn.textContent='送出報名'; btn.disabled=false;
    const okGo=await confirmBeforeSubmit([{rows:[['活動',curSignupEvent.name||''],['組別',g?.name||''],['姓名',name],['性別',gender],['生日',birthday],['手機',phone],['Email',email],['身分證',idNumber],[memberRule.label,memberNo],['號碼',getEffBibSettings(g).fromMember?memberNo.normalize('NFKC').replace(/[\s/]+/g,'').toUpperCase():customBib],['備註',note]].concat(cfConfirmRows(curSignupCustomFields,customData))}]);
    if(!okGo) return;
    btn.textContent='送出中...'; btn.disabled=true;
    if(!currentTurnstileToken){showToast('請稍候，人機驗證還在進行中，請幾秒後再試一次','error');btn.textContent='送出報名';btn.disabled=false;return;}
    const runnerSignupFn=callFn('runnerSignup');
    const payload={
      eventId,groupId:group,name,gender,birthday,phone,email,idNumber,note,customData,
      inviteCode:document.getElementById('suInviteCode')?.value.trim()||'',
      memberNo,
      customBib:customBib||'',
      turnstileToken:currentTurnstileToken,
      parental:(parentalDataForSet.parentalConsentAgreed
        ?{consent:true,parentName:parentalDataForSet.parentName,parentPhone:parentalDataForSet.parentPhone}
        :null),
      // 填表時已經確認過身分（帶出舊號碼時）：一起送出，不會再問一次
      identity:(suBibPre.identity&&suBibPre.key===bibPreKey(bibLookupProfile(f=>({name,gender,birthday,phone,email,idNumber})[f]||'')))?suBibPre.identity:{}
    };
    let idq=payload.identity;
    let res=(await runnerSignupFn(payload)).data;
    // 找到同姓名、同性別、同生日的人：一題一題確認身分，再帶著答案重送
    while(res.status==='needs-identity'){
      btn.textContent='送出報名'; btn.disabled=false;
      const nx=await askIdentity(res.step,idq,'');
      if(!nx){ resetTurnstileWidget(); return; }
      idq=nx;
      btn.textContent='送出中...'; btn.disabled=true;
      resetTurnstileWidget();
      const freshToken=await waitForFreshTurnstileToken();
      res=(await runnerSignupFn({...payload,turnstileToken:freshToken,identity:idq})).data;
    }

    // 已報名過這場活動的情況，伺服器現在會直接拋錯（引導去用修改功能），
    // 不會再回傳 already-registered/reactivated 這兩種狀態，所以這裡不用特別處理，
    // 會直接落到下面的 catch 顯示錯誤訊息
    // 這次報名可能用掉一個號碼（自選或自動配號），「查看可用號碼」的快取要清掉，
    // 不然剛用掉的號碼要重整頁面才會反映
    showSignupSuccess({uniqueId:res.uniqueId,name,gender,group:g?.name||group,bibNumber:res.bibNumber,eventName:curSignupEvent.name,eventDate:curSignupEvent.date});
  }catch(e){
    showToast('報名失敗：'+e.message,'error');
    resetTurnstileWidget();
    const b=document.getElementById('suSubmitBtn');
    if(b){b.textContent='送出報名';b.disabled=false;}
  }
  } finally {
    // 不管上面驗證中途 return、成功、還是失敗，這裡都會執行，
    // 確保鎖一定會解開、按鈕一定會恢復，不會卡死
    window._suSubmitting=false;
    if(btn){btn.disabled=false;btn.textContent='送出報名';}
  }
}

// 多人報名（活動 multiSignup.enabled）
// 同一套表單元件用在兩個地方：報名分頁（ns='mp'，新報名）、查詢分頁（ns='mb'，用批次代碼修改整批）。
// 自訂欄位：區塊標題設成「共同填寫」的區塊整批只填一次，其他欄位每人各填；
// 顯示條件用 cfVisibilityMulti（共用欄位任一人符合就顯示）。真正的把關在 Cloud Function。
// ════════════════════════════════════════════════════════════════
const MF={};
function mfInit(ns, o){
  const st={ns, seq:0, keys:[], entryIds:{}, ...o};
  st.sids=cfSharedIds(st.fields);
  st.groupMap={}; (st.groupDocs||[]).forEach(g=>{st.groupMap[g.id]=g;});
  MF[ns]=st; return st;
}
const mfPersonFields=st=>st.fields.filter(f=>!st.sids.has(f.id));
const mfSharedFields=st=>st.fields.filter(f=>st.sids.has(f.id));
function mfPersonHtml(st, k, p){
  const ns=st.ns, P=ns+k+'_', pr=(p&&p.profile)||{}, en=(p&&p.entry)||{};
  const fs=st.ev.fieldSettings||{};
  const inp=(id,label,req,val,ph,type)=>'<div class="input-group"><label>'+label+(req?' <span class="required-star">*</span>':'')+'</label><input id="'+P+id+'" type="'+(type||'text')+'" class="input" placeholder="'+(ph||'')+'" value="'+esc(val||'')+'" oninput="applyHalf(this)"></div>';
  let h='<div class="card mf-person" id="'+P+'card" style="border-left:3px solid var(--accent)">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><strong class="mf-title" style="font-size:1rem"></strong>';
  if(st.edit){
    h+='<span style="font-size:.78rem;color:var(--muted)">編號 <strong style="color:var(--green)">'+esc(en.bibNumber||'-')+'</strong>　ID <span class="mono">'+esc(en.uniqueId||'')+'</span></span>';
  } else {
    h+='<button type="button" class="btn btn-sm btn-ghost mf-remove" onclick="mfRemovePerson(\''+ns+'\','+k+')">✕ 移除</button>';
  }
  h+='</div>';
  if(st.edit&&en.cancelRequested) h+='<div class="csv-hint" style="color:var(--red)">⚠️ 這位已申請取消，等待主辦單位確認</div>';
  h+=groupSelectHtml(P+'group', st.groupDocs, st.gCfg, en.groupId||'', 'mfRefresh(\''+ns+'\')', en.groupId||'');
  if(st.gCfg.show) h+='<div id="'+P+'ghint" style="font-size:.75rem;margin-top:4px;min-height:14px;color:var(--muted);white-space:pre-line"></div></div>';
  // 邀請碼：新報名依組別；整批修改時，換到需要另一組邀請碼的組別才顯示
  h+='<div class="input-group" id="'+P+'inviteRow" style="display:none"><label>邀請碼 <span class="required-star">*</span></label><input id="'+P+'invite" type="text" class="input" placeholder="'+(st.edit?'換到這個組別需要邀請碼':'請輸入邀請碼')+'"></div>';
  h+=memberFieldHtml(P+'member',en.memberNo||'');
  if(!st.edit) h+='<div class="input-group" id="'+P+'bibRow" style="display:none"><label id="'+P+'bibLabel">參加者號碼（選填）</label>'
    +'<div class="input-row" style="align-items:center">'+bibAffixWrap('<input id="'+P+'bib" type="text" class="input" oninput="applyHalf(this)">',P+'bib')
    +'<button type="button" class="btn btn-ghost btn-sm" onclick="mfToggleBibs(\''+ns+'\','+k+')">查看可用號碼</button></div>'
    +'<div id="'+P+'bibNote" style="font-size:.75rem;color:var(--text);margin-top:4px;white-space:pre-line"></div>'
    +'<div id="'+P+'bibHint" style="font-size:.75rem;margin-top:4px"></div>'
    +'<div id="'+P+'bibPanel" style="display:none;margin-top:6px;padding:8px;background:var(--surface2);border-radius:8px"></div></div>';
  if(!st.edit) h+='<div id="'+P+'bibInfo" style="font-size:.82rem;margin:-6px 0 12px"></div>';
  h+=inp('name','姓名',true,pr.name,'王小明');
  if(!st.edit) h+='<div style="font-size:.72rem;color:var(--muted);margin:-8px 0 10px">以前報名過、後來改名的人：請先用舊名字報名，報名後再改名</div>';
  h+='<div class="input-group"><label>性別 <span class="required-star">*</span></label><select id="'+P+'gender" class="input"><option value="">請選擇...</option>'
    +['男','女'].map(g=>'<option value="'+g+'"'+(pr.gender===g?' selected':'')+'>'+g+'</option>').join('')+'</select></div>';
  h+='<div class="input-group"><label>生日（yyyy/mm/dd） <span class="required-star">*</span></label><input id="'+P+'birthday" data-fmt="ymd" type="text" class="input" placeholder="yyyy/mm/dd" value="'+esc(pr.birthday||'')+'" oninput="applyHalf(this)"></div>';
  if(fs.phone?.show!==false) h+=inp('phone','手機號碼（09開頭10碼）',fs.phone?.required===true,pr.phone,'0912345678','tel');
  if(fs.email?.show!==false) h+=inp('email','E-Mail',fs.email?.required===true,pr.email,'example@email.com','email');
  if(fs.idNumber?.show!==false) h+=inp('idNumber','身分證字號（1英文+9數字）',fs.idNumber?.required===true,pr.idNumber,'A123456789');
  h+=inp('note','備註',false,pr.note,'');
  h+=mfFieldsHtml(mfPersonFields(st), P+'cf_', P+'cf_row_', en.customData||{});
  h+='<div id="'+P+'parental" style="display:none"><div style="padding:12px;background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.3);border-radius:8px;margin-bottom:14px">'
    +'<label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:.85rem;line-height:1.5"><input type="checkbox" id="'+P+'pc" style="margin-top:3px;flex-shrink:0"'+(en.parentalConsentAgreed?' checked':'')+'><span>本人（家長／監護人）已閱讀相關規定，同意全程陪同參加者完成活動，並承擔相關責任。</span></label>'
    +'<div class="input-group" style="margin-top:10px;margin-bottom:0"><label>緊急聯絡人姓名 <span class="required-star">*</span></label><input id="'+P+'pn" type="text" class="input" value="'+esc(en.parentName||'')+'"></div>'
    +'<div class="input-group" style="margin-top:10px;margin-bottom:0"><label>緊急聯絡人手機 <span class="required-star">*</span></label><input id="'+P+'pp" type="tel" class="input" value="'+esc(en.parentPhone||'')+'" oninput="applyHalf(this)"></div>'
    +'<button type="button" class="btn btn-sm btn-ghost" style="margin-top:8px" onclick="mfParentFromSubmitter(\''+ns+'\','+k+')">帶入填表人</button>'
    +'</div></div>';
  if(st.edit){
    h+=en.cancelRequested
      ?'<button type="button" class="btn btn-sm btn-ghost mf-act" onclick="mfBatchAct(\''+ns+'\','+k+',\'withdraw\')">↩️ 撤銷取消申請</button>'
      :'<button type="button" class="btn btn-sm btn-danger mf-act" onclick="mfBatchAct(\''+ns+'\','+k+',\'cancel\')">申請取消這位</button>';
  }
  return h+'</div>';
}
// 整個多人表單（submitLabel／onSubmit 依新報名或修改而不同）
function mfFormHtml(st, data){
  const ns=st.ns, sb=(data&&data.submitter)||{};
  let h='<div class="card"><div style="font-weight:800;margin-bottom:6px">填表人</div>'

  if(st.edit&&!st.regOpen) h+='<div class="csv-hint" style="margin-top:8px">目前非開放報名期間，只能查看，無法修改。</div>';

window.mfAddPerson=function(ns, p){
  const st=MF[ns]; if(!st) return;
  if(!st.edit&&st.keys.length>=st.max){ showToast('一次最多報名 '+st.max+' 位','error'); return; }
  const k=++st.seq; st.keys.push(k);
  if(p&&p.entryDocId) st.entryIds[k]=p.entryDocId;
  st.origGroup=st.origGroup||{}; st.origGroup[k]=(p&&p.entry&&p.entry.groupId)||'';
  document.getElementById(ns+'_persons').insertAdjacentHTML('beforeend', mfPersonHtml(st,k,p));
  mfRefresh(ns);
};
window.mfRemovePerson=function(ns, k){
  const st=MF[ns]; if(!st) return;
  if(st.keys.length<=1){ showToast('至少要有一位參加者','error'); return; }
  const card=document.getElementById(ns+k+'_card');
  const name=document.getElementById(ns+k+'_name')?.value.trim();
  if(name&&!confirm('確定移除「'+name+'」？'))return;
  if(card) card.remove();
  st.keys=st.keys.filter(x=>x!==k);
  mfRefresh(ns);
};
window.mfParentFromSubmitter=function(ns,k){
  document.getElementById(ns+k+'_pn').value=document.getElementById(ns+'_sbName').value;
  document.getElementById(ns+k+'_pp').value=document.getElementById(ns+'_sbPhone').value;
};
// 多人報名：每一位的自選號碼欄位依他的組別（或活動）設定顯示
function mfRefreshBib(st,k,g){
  const P=st.ns+k+'_', row=document.getElementById(P+'bibRow'); if(!row) return;
  const bc=getEffBibSettings(g,st.ev);
  const key=(g?g.id:'')+'|'+bc.prefix+'|'+bc.suffix;
  setBibAffix(P+'bib',bc);
  row.style.display=(!bc.fromMember&&bc.allowCustomBib&&bibModeOf(st.ev)!=='fixed')?'':'none';
  applyMfBibPre(st,k,bc);
  if(row.dataset.key===key) return;
  row.dataset.key=key;
  document.getElementById(P+'bibLabel').textContent='參加者號碼（選填，號碼須在 '+bc.min+'～'+bc.max+' 之間，留空系統自動配號）';
  document.getElementById(P+'bibNote').textContent=bc.note||'';
  document.getElementById(P+'bibPanel').style.display='none';
  const el=document.getElementById(P+'bib'); if(el){ el.dataset.exhaustChecked=''; el.placeholder='例：'+String(bc.min).padStart(bc.pad,'0'); }
}
function applyMfBibPre(st,k,bc){

// 讀取整張表單並做前端預檢；回傳 {payload} 或 {error}
function mfRead(st){
  const ns=st.ns, fs=st.ev.fieldSettings||{};
  const vm=mfRefresh(ns);
  const submitter={name:document.getElementById(ns+'_sbName').value.trim(), phone:document.getElementById(ns+'_sbPhone').value.trim(), email:document.getElementById(ns+'_sbEmail').value.trim()};
  if(!submitter.name) return {error:'請填寫填表人姓名'};
  if(!/^09\d{8}$/.test(submitter.phone)) return {error:'請填寫正確的填表人手機（09開頭10碼）'};
  if(submitter.email&&!validateEmail(submitter.email)) return {error:'填表人 Email 格式錯誤'};
  const persons=[];
  for(let i=0;i<st.keys.length;i++){
    const k=st.keys[i], P=ns+k+'_', v=id=>(document.getElementById(P+id)?.value||'').trim();
    const p={groupId:v('group'), name:v('name'), gender:v('gender'), birthday:v('birthday'), phone:v('phone'), email:v('email'), idNumber:v('idNumber').toUpperCase(), note:v('note')};
    const who='第 '+(i+1)+' 位'+(p.name?'（'+p.name+'）':'')+'：';
    if(st.gCfg.required&&!p.groupId) return {error:who+'請選擇組別'};
    if(!p.name) return {error:who+'請填寫姓名'};
    if(!p.gender) return {error:who+'請選擇性別'};
    if(!p.birthday||!validateBirthday(p.birthday)) return {error:who+'請填寫正確的生日（yyyy/mm/dd）'};
    if(fs.phone?.show!==false&&fs.phone?.required&&!p.phone) return {error:who+'請填寫手機號碼'};
    if(p.phone&&!validatePhone(p.phone)) return {error:who+'手機號碼格式錯誤'};
    if(fs.email?.show!==false&&fs.email?.required&&!p.email) return {error:who+'請填寫 E-Mail'};
    if(p.email&&!validateEmail(p.email)) return {error:who+'Email 格式錯誤'};
    if(fs.idNumber?.show!==false&&fs.idNumber?.required&&!p.idNumber) return {error:who+'請填寫身分證字號'};
    if(p.idNumber&&!validateId(p.idNumber)) return {error:who+'身分證字號格式錯誤'};
    const g=st.groupMap[p.groupId];
    const limErr=regLimitError(st.ev,g,p.gender,p.birthday,st.ev.date||'');
    if(limErr) return {error:who+limErr};
    const mr=memberRuleR(st.ev,g);
    p.memberNo=memberNeedsInput(mr)?v('member'):'';
    if(memberNeedsInput(mr)&&!p.memberNo) return {error:who+'請填寫'+mr.label};
    if(st.edit){
      const og=(st.origGroup||{})[k]||'';
      if(inviteNeededOnMove(st.ev,st.groupMap[og],g,og,p.groupId)){ p.inviteCode=v('invite'); if(!p.inviteCode) return {error:who+'換到這個組別需要邀請碼'}; }
    }
    if(!st.edit){
      p.inviteCode=v('invite'); if(inviteTarget(st.ev,g)&&!p.inviteCode) return {error:who+'請輸入邀請碼'};
      // 自選號碼（有開放時才有欄位；留空＝自動配號）
      const bibRaw=v('bib');
      if(bibRaw&&document.getElementById(P+'bibRow')?.style.display!=='none'){
        // 號碼能不能用由伺服器號碼池判斷（送出時）；這裡只組成完整號碼給確認視窗看
        const bc=getEffBibSettings(g,st.ev); const n=bibNumOf(bibRaw,P+'bib');
        if(isNaN(n)||n<1) return {error:who+'號碼請填數字（前後綴會自動加上）'};
        p.customBib=bibStr(n,bc.pad,P+'bib');
      }
    }
    if(mfNeedsParental(st,k)){
      const pc=document.getElementById(P+'pc').checked, pn=v('pn'), pp=v('pp');
      if(!pc||!pn||!pp) return {error:who+'此年齡需勾選家長陪同聲明並填寫緊急聯絡人'};
      p.parental={consent:true,parentName:pn,parentPhone:pp};
    }
    const r=mfCollectCf(mfPersonFields(st), P+'cf_', vm.persons[i], {onDate:st.ev.date||''});
    if(r.error) return {error:who+r.error};
    p.customData=r.data;
    if(st.edit) p.entryDocId=st.entryIds[k];
    persons.push(p);
  }
  const rs=mfCollectCf(mfSharedFields(st), ns+'S_cf_', vm.shared, {onDate:st.ev.date||''});
  if(rs.error) return {error:'共同填寫：'+rs.error};
  return {payload:{submitter, shared:rs.data, persons}};
}

window.mfSubmitSignup=async function(ns){
  const st=MF[ns]; if(!st||st.busy) return;
  const r=mfRead(st);
  if(r.error){ showToast(r.error,'error'); return; }
  const btn=document.getElementById(ns+'_submitBtn');
  if(!currentTurnstileToken){ showToast('請稍候，人機驗證還在進行中，請幾秒後再試一次','error'); return; }
  st.busy=true;
  // 送出前確認資料
  if(!(await confirmBeforeSubmit(mfConfirmSections(st,r.payload)))){ st.busy=false; return; }
  btn.disabled=true; btn.textContent='送出中...';
  try{
    const fn=callFn('runnerBatchSignup');
    // 填表時已經確認過的身分一起送出
    const identities=st.keys.map(k=>{ const x=(st.pre||{})[k]; return (x&&x.identity&&x.key===bibPreKey(mfPersonProfile(ns,k)))?x.identity:{}; });
    const payload={eventId:curSignupEvent.id, ...r.payload, turnstileToken:currentTurnstileToken, identities};
    let res=(await fn(payload)).data;
    while(res.status==='needs-identity'){
      btn.disabled=false; btn.textContent='送出報名';
      for(const c of res.persons||[]){
        const p=r.payload.persons[c.index]||{};
        const nx=await askIdentity(c.step, identities[c.index], '第 '+(c.index+1)+' 位（'+(p.name||'')+'）');
        if(!nx){ resetTurnstileWidget(); return; }
        identities[c.index]=nx;
      }
      btn.disabled=true; btn.textContent='送出中...';
      resetTurnstileWidget();
      const fresh=await waitForFreshTurnstileToken();
      res=(await fn({...payload, turnstileToken:fresh, identities})).data;
    }
    showBatchSuccess(res, r.payload.submitter);
  }catch(e){
    showToast('報名失敗：'+e.message,'error');
    resetTurnstileWidget();
  }finally{
    st.busy=false;
    const b=document.getElementById(ns+'_submitBtn'); if(b){ b.disabled=false; b.textContent='送出報名'; }
  }
};

// 全部存成圖片：手機用系統分享（可一次存到相簿或傳到 LINE）；電腦下載 ZIP；都不行就逐張下載
window.saveAllBatchPng=async function(){
  const ps=lastBatchInfo?.persons||[]; if(!ps.length) return;
  showToast('正在產生 '+ps.length+' 張圖片...');
  const files=[];
  for(let i=0;i<ps.length;i++){
    const cv=await renderElementCanvas(document.getElementById('batchCard_'+i));
    if(!cv){ showToast('圖片產生失敗，請改用截圖保存','error'); return; }
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    files.push(new File([blob],'報名資訊_'+(ps[i].bibNumber||'')+'_'+(ps[i].name||'')+'.png',{type:'image/png'}));
  }
  const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(isMobile&&navigator.canShare&&navigator.canShare({files})){
    // 分享一定要在使用者點擊當下呼叫，產生圖片花了時間，所以再請使用者點一次
    showShareFilesOverlay(files);
    return;
  }
  const zipName='報名資訊_'+(lastBatchInfo.batchCode||'')+'.zip';
  try{
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const zip=new JSZip(); files.forEach(f=>zip.file(f.name,f));
    downloadBlob(await zip.generateAsync({type:'blob'}), zipName);
    showToast('已下載 '+zipName);
  }catch(e){
    for(const f of files){ downloadBlob(f,f.name); await new Promise(r=>setTimeout(r,400)); }
    showToast('已逐張下載 '+files.length+' 張圖片');
  }
};
function loadScriptOnce(src){
  return new Promise((ok,fail)=>{
    if(document.querySelector('script[src="'+src+'"]')&&window.JSZip) return ok();
    const sc=document.createElement('script'); sc.src=src; sc.onload=()=>ok(); sc.onerror=()=>fail(new Error('load'));
    document.head.appendChild(sc);
  });
}
function showShareFilesOverlay(files){
  let ov=document.getElementById('pngPreviewOverlay'); if(ov) ov.remove();
  ov=document.createElement('div'); ov.id='pngPreviewOverlay';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px';
  ov.innerHTML='<div style="color:#fff;font-weight:700;font-size:1rem;text-align:center">'+files.length+' 張圖片已準備好</div>'
    +'<div style="color:#ddd;font-size:.85rem;text-align:center">按「分享／儲存」後，選「儲存 '+files.length+' 張影像」可存到相簿，或直接分享到 LINE</div>'
    +'<div style="display:flex;gap:8px;width:100%;max-width:360px"><button class="btn btn-ghost" style="flex:1" data-act="close">關閉</button>'
    +'<button class="btn btn-primary" style="flex:1" data-act="share">分享／儲存</button></div>';
  ov.addEventListener('click',async e=>{
    const act=e.target.dataset?.act;
    if(act==='close'||e.target===ov){ ov.remove(); return; }
    if(act==='share'){
      try{ await navigator.share({files}); ov.remove(); }
      catch(err){ if(err.name!=='AbortError'){ for(const f of files) downloadBlob(f,f.name); ov.remove(); } }
    }
  });
  document.body.appendChild(ov);
}

    let res=(await fn(payload)).data;
    // 有人改了姓名、性別、生日或身分證：確認是同一人修改資料
    if(res.status==='confirm-identity-change'){

// ── 報到設定與報名資訊卡說明 ──
// ev.checkin = { required, bib, qr }：需不需要報到；報到方式可複選或都不選（都不選＝報到時用姓名查找）
// 沒設定過的舊活動＝需要報到、編號與 QR Code 都可用（跟原本一樣）
function checkinCfg(ev){
  const c=(ev||{}).checkin;
  if(!c||typeof c!=='object') return {required:true, bib:true, qr:true};
  const req=c.required!==false;
  return {required:req, bib:req&&c.bib===true, qr:req&&c.qr===true};
}
// 報名資訊卡下方的說明：依「報到方式」與「查詢修改是否一定要編號」組合
function regInfoNote(ev){
  const c=checkinCfg(ev), needBib=(ev||{}).queryRequireBib===true;
  const qOk='查詢、修改報名只要姓名、性別、生日，不需要編號。';
  let t;
  if(!c.required){
    t='此活動不需要報到。'+(needBib?'查詢、修改報名時需要編號，請記下編號或存成圖片。':qOk);
  } else if(c.qr){
    t='活動當天報到時請出示 QR Code'+(c.bib?' 或告知編號':'')+'，請把這張圖片存起來或截圖。'
      +(needBib?'查詢、修改報名時也需要編號。':'查詢、修改報名則只要姓名、性別、生日。');
  } else if(c.bib){
    t='活動當天報到時請告知編號'+(needBib?'，查詢、修改報名時也需要編號':'')+'。請記下編號，怕忘記可以存成圖片。'
      +(needBib?'':'查詢、修改報名則只要姓名、性別、生日。');
  } else {
    t='活動當天報到時告知姓名即可，不需要編號或圖片。'
      +(needBib?'不過查詢、修改報名時需要編號，請記下編號或存成圖片。':qOk);
  }
  return t+'查詢歷次報名紀錄請使用上方 ID。';
}

// ── 把畫面上的某個區塊存成 PNG ──
// 電腦：直接下載檔案
// 手機／LINE、FB 等 App 內建瀏覽器：下載常常沒反應，改成跳出圖片預覽，
// 讓使用者長按圖片存到相簿（預覽裡另有「下載／分享」按鈕可試）
async function saveElementAsPng(el,filename){
  if(!el)return;
  if(typeof html2canvas==='undefined'){showToast('圖片功能載入失敗，請改用截圖保存','error');return;}
  showToast('正在產生圖片...');
  const canvas=await renderElementCanvas(el);
  if(!canvas){showToast('圖片產生失敗，請改用截圖保存','error');return;}
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
    ||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1); // iPadOS 會偽裝成 Mac
  if(isMobile||!blob){showPngPreview(canvas.toDataURL('image/png'),blob,filename);return;}
  downloadBlob(blob,filename);
  showToast('圖片已下載');
}
// 把畫面區塊畫成 canvas（失敗回傳 null）
async function renderElementCanvas(el){
  if(!el||typeof html2canvas==='undefined') return null;
  let canvas;
  try{
    const bg=getComputedStyle(document.body).backgroundColor||'#0f1117';
    // 要截的區塊本身不是卡片（例如查詢結果裡的報名資訊）時，匯出時補上卡片外框和留白，圖片才不會貼邊
    const needFrame=!el.classList.contains('card')&&el.id;
    canvas=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:bg,
      onclone:doc=>{
        if(!needFrame)return;
        const c=doc.getElementById(el.id);
        if(c)Object.assign(c.style,{padding:'20px',border:'1px solid #2e3349',borderRadius:'14px',background:'#1a1d27'});
      }});
  }catch(e){return null;}
  return canvas;
}
function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function showPngPreview(dataUrl,blob,filename){
  let ov=document.getElementById('pngPreviewOverlay');
  if(ov)ov.remove();
  ov=document.createElement('div');
  ov.id='pngPreviewOverlay';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px';
  ov.innerHTML='<div style="color:#fff;font-weight:700;font-size:.95rem;text-align:center">長按圖片即可儲存到相簿</div>'
    +'<img src="'+dataUrl+'" style="max-width:100%;max-height:68vh;border-radius:12px;-webkit-touch-callout:default;user-select:auto">'
    +'<div style="display:flex;gap:8px;width:100%;max-width:360px">'
    +'<button class="btn btn-ghost" style="flex:1" data-act="close">關閉</button>'
    +(blob?'<button class="btn btn-primary" style="flex:1" data-act="save">下載／分享</button>':'')
    +'</div>';
  ov.addEventListener('click',async e=>{
    const act=e.target.dataset?.act;
    if(act==='close'||e.target===ov){ov.remove();return;}
    if(act==='save'&&blob){
      const file=new File([blob],filename,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file]});return;}
        catch(err){if(err.name==='AbortError')return;}
      }
      downloadBlob(blob,filename);
    }
  });
  document.body.appendChild(ov);
}

window.doStatusQuery=async function(){
  if(!curStatusEvent){showToast('請先選擇活動','error');return;}

  result.innerHTML='<div class="card"><div class="loading-cell">查詢中...</div></div>';

  const eventId=curStatusEvent.id;
  const ev=curStatusEvent;
  let res;
  try{
    res=(await callFn('runnerStatus')({eventId,bib,name,gender,birthday})).data;
  }catch(err){
    result.innerHTML='<div class="card"><div class="loading-cell" style="color:var(--red)">查詢失敗：'+esc(err.message)+'</div></div>';

    return;
  }

  let html=''; let found=false;
  const matched=[];
  for(const m of (res.matched||[])){
    const e=m.entry;
    const eDoc={id:m.entryDocId};
    const entryName=m.profile.name||'';

        html+='<div id="'+cardId+'_actions">';
        html+='<div style="padding:10px 12px;background:var(--surface2);border-radius:8px;font-size:.82rem;color:var(--muted);margin-bottom:8px">⏳ 已送出取消申請，請等待主辦方確認</div>';

        html+='</div>';

// 修改表單：依目前選擇的組別，顯示組別註解與限制摘要
// （跟新報名表單的 onSignupGroupChange 邏輯一致；灰字=純資訊提示，真的驗證失敗時另外在 saveEditEntry 裡改成紅字）
window.updateEditGroupInfo=function(cardId, gMapJson){
  const noteEl=document.getElementById(cardId+'_eGroupNote');
  const hint=document.getElementById(cardId+'_eGroupHint');
  if(!noteEl||!hint)return;
  let gMap={}; try{gMap=JSON.parse(gMapJson);}catch(e){}
  const group=document.getElementById(cardId+'_eGroup')?.value;
  const g=gMap[group];
  noteEl.textContent=g?.note||'';
  hint.textContent=limitHintText(gMap.__ev||{},g);
  hint.style.whiteSpace='pre-line';
  hint.style.color='var(--muted)';
}
// 組別下方的說明：沒選組別＝「活動報名限制」；選了組別＝「此組別報名限制」（組別自訂就是組別的，沒自訂就是活動的）＋組別名額
// 報名表單、多人報名、修改表單共用（邀請碼另有欄位，不列）
function limitHintText(ev, g){
  const own=!!g&&groupLimitOverride(g);
  const list=limitHintList(own?g:(ev||{})).filter(x=>x!=='需要邀請碼');
  if(g&&g.groupCapacity>0) list.push('限'+g.groupCapacity+'人');
  const lines=[];
  const dist=g?groupDistText(g.distance,g.distanceUnit):'';
  if(dist) lines.push('組別資訊：'+dist);
  if(list.length) lines.push((g?'此組別報名限制：':'活動報名限制：')+list.join('、'));
  return lines.join('\n');
}
// 組別提示文字：第一行「組別資訊」（有設定距離才顯示），第二行「此組別限制」
function groupHintText(g, limitHints){
  const dist=groupDistText(g.distance,g.distanceUnit);
  const lines=[];
  if(dist)lines.push('組別資訊：'+dist);
  if(limitHints.length)lines.push('此組別限制：'+limitHints.join('、'));
  return lines.join('\n');
}

// 修改表單：依生日/組別更新家長陪同區塊顯示
// 判斷結果寫在 block.dataset.need（每張卡片各自獨立），
// 取代原本的全域旗標——舊寫法同時開兩張卡的編輯表單時會互相覆蓋，
// 「是否需要家長欄位」會變成最後一次判斷的那張卡的值。
window.updateEditParentalBlock=function(cardId, gMapJson, evDate){
  const block=document.getElementById(cardId+'_eParentalBlock');
  if(!block)return false;
  const set=(need)=>{block.dataset.need=need?'1':'';block.style.display=need?'':'none';return need;};
  try{
    const gMap=JSON.parse(gMapJson);
    const group=document.getElementById(cardId+'_eGroup')?.value;
    const birthday=document.getElementById(cardId+'_eBirthday')?.value.trim();
    const g=group?gMap[group]:null;
    const pAge=effParentalAge(gMap.__ev,g); // 活動或組別任一個門檻
    if(!(pAge>0))return set(false);
    if(!(birthday&&validateBirthday(birthday)))return set(false);
    const base=evDate||new Date().getFullYear()+'-01-01';
    const age=calcAgeRunner(birthday,base);
    // 算不出年齡（日期異常）時保守隱藏——伺服器端會做最終判斷
    return set(!(age===null||age>=pAge));
  }catch(e){return set(false);}
}

window.saveEditEntry=async function(eventId,entryDocId,cardId){
  let fs={}; try{fs=JSON.parse(document.getElementById(cardId+'_edit')?.dataset.fs||'{}');}catch(e){}

  const idNumber=(fs.idNumber?.show!==false)?(document.getElementById(cardId+'_eIdNumber')?.value.trim()||''):'';

  const wantAutoBib=!!rangeEl&&newBibRaw==='';
  if(newBibRaw&&rangeEl&&newBibRaw===(rangeEl.dataset.oldBib||'')){
    // 原封不動＝沒有要換號碼
  }else if(newBibRaw){
    // 要換號碼：送出前問伺服器號碼池確認一次（失焦檢查只是輔助不是保證）
    setEditBibCtx(eventId,cardId);

    if(!r.ok){ showToast('號碼：'+r.message,'error'); return; }
    newBib=r.keep?'':(r.bib||newBibRaw);
  }
  if(!name){showToast('姓名為必填','error');return;}
  if(!gender){showToast('性別為必選','error');return;}
  if(!birthday){setFieldError(cardId+'_eBirthday',true);showToast('生日為必填','error');return;}
  if(!validateBirthday(birthday)){setFieldError(cardId+'_eBirthday',true);showToast('生日格式錯誤或不合理（不能是未來日期）','error');return;}
  setFieldError(cardId+'_eBirthday',false);
  if(fs.phone?.show!==false){
    if(fs.phone?.required&&!phone){setFieldError(cardId+'_ePhone',true);showToast('請填寫手機號碼','error');return;}
    if(phone&&!validatePhone(phone)){setFieldError(cardId+'_ePhone',true);showToast('手機號碼格式錯誤','error');return;}
    setFieldError(cardId+'_ePhone',false);
  }
  if(fs.email?.show!==false){
    if(fs.email?.required&&!email){setFieldError(cardId+'_eEmail',true);showToast('請填寫 E-Mail','error');return;}
    if(email&&!validateEmail(email)){setFieldError(cardId+'_eEmail',true);showToast('Email格式錯誤','error');return;}
    setFieldError(cardId+'_eEmail',false);
  }
  if(fs.idNumber?.show!==false){
    if(fs.idNumber?.required&&!idNumber){setFieldError(cardId+'_eIdNumber',true);showToast('請填寫身分證字號','error');return;}
    if(idNumber&&!validateId(idNumber)){setFieldError(cardId+'_eIdNumber',true);showToast('身分證格式錯誤','error');return;}
    setFieldError(cardId+'_eIdNumber',false);
  }
  // 組別限制驗證（性別/年齡/名額；換到需要另一組邀請碼的組別要填邀請碼，見下方）
  // ── 灰字提示跟錯誤紅字共用同一個 eGroupHint 元素：平常是 updateEditGroupInfo() 寫入的灰字摘要，
  //    這裡驗證失敗時覆寫成紅字錯誤訊息，跟管理員端 eGroupHint 的顏色邏輯一致
  {
    const editBox0=document.getElementById(cardId+'_edit');
    let gMap0={}; try{gMap0=JSON.parse(editBox0?.dataset.gmap||'{}');}catch(e){}
    const g0=gMap0[groupId];
    const groupHintEl=document.getElementById(cardId+'_eGroupHint');
    const failGroup=(msg)=>{
      if(groupHintEl){groupHintEl.textContent=msg;groupHintEl.style.color='var(--red)';}
      showToast(msg,'error');
    };
    {
      const limErr=regLimitError(gMap0.__ev,g0,gender,birthday,editBox0?.dataset.evdate||'');
      if(limErr){failGroup(limErr);return;}
    }
    if(g0){
      // 名額只在「真的換到不同組別」時才檢查，避免原本就在額滿組別的人被自己卡住
      const origGroupId=statusCache[entryDocId]?.entry?.groupId;
      if(groupId!==origGroupId&&g0.groupCapacity>0){
        const capSnap=await getCountFromServer(query(collection(db,'systems',SYS,'events',eventId,'runners'),where('groupId','==',groupId)));
        if(capSnap.data().count>=g0.groupCapacity){failGroup('此組別已額滿（'+g0.groupCapacity+'人）');return;}
      }
    }
  }
  // 會員編號（比對名單在伺服器做）；換到需要另一組邀請碼的組別要填對邀請碼
  const ectx=editCtx[cardId]||{ev:{},groupMap:{},origGroupId:''};
  const emr=memberRuleR(ectx.ev,ectx.groupMap[groupId]);
  const memberNo=memberNeedsInput(emr)?(document.getElementById(cardId+'_eMember')?.value.trim()||''):'';
  if(memberNeedsInput(emr)&&!memberNo){setFieldError(cardId+'_eMember',true);showToast('請填寫'+emr.label,'error');return;}
  setFieldError(cardId+'_eMember',false);
  const invNeed=inviteNeededOnMove(ectx.ev,ectx.groupMap[ectx.origGroupId],ectx.groupMap[groupId],ectx.origGroupId,groupId);
  const inviteCode=invNeed?(document.getElementById(cardId+'_eInvite')?.value.trim()||''):'';
  if(invNeed&&!inviteCode){showToast('換到這個組別需要邀請碼','error');return;}
  if(invNeed&&!(await checkInviteCode(invNeed,inviteCode))){showToast('邀請碼不正確','error');return;}
  const customFields=JSON.parse(document.getElementById(cardId+'_edit').dataset.customFields||'[]');
  const customData={};
  const editVis=updateEditCustomFieldsVisibility(cardId)||{};
  { const r=cfCollect(customFields, cardId+'_ecf_', editVis, {onDate:document.getElementById(cardId+'_edit').dataset.evdate||''}); if(r.error){showToast(r.error,'error');return;} Object.assign(customData, r.data); }
  // 家長陪同欄位：儲存前依「目前表單的組別＋生日」即時重算是否需要
  const editBox=document.getElementById(cardId+'_edit');
  const needParental=updateEditParentalBlock(cardId,editBox?.dataset.gmap||'{}',editBox?.dataset.evdate||'');
  let parentalData={};
  if(needParental){
    const consent=document.getElementById(cardId+'_eParentalConsent')?.checked||false;
    const parentName=document.getElementById(cardId+'_eParentName')?.value.trim()||'';
    const parentPhone=document.getElementById(cardId+'_eParentPhone')?.value.trim()||'';
    if(!consent){showToast('請勾選家長陪同聲明','error');return;}
    if(!parentName){showToast('請填寫緊急聯絡人姓名','error');return;}
    if(!parentPhone||!validatePhone(parentPhone)){showToast('請填寫正確的緊急聯絡人手機','error');return;}
    parentalData={parentalConsentAgreed:true,parentName,parentPhone};
  }
  try{
    // 全部交給 Cloud Function：伺服器端重新驗證身分後，原子地更新個人資料
    // 與報名資料（含改號碼的防撞號交易與家長陪同/必填欄位的伺服器端驗證）
    const callPayload={
      eventId,entryDocId,action:'save',credentials:statusCred,
      profile:{name,gender,birthday,phone,email,idNumber,note},
      entry:{groupId,customData,newBib:newBib||'',wantAutoBib,memberNo},
      inviteCode,
      parental:(needParental
        ?{consent:document.getElementById(cardId+'_eParentalConsent')?.checked||false,
          parentName:document.getElementById(cardId+'_eParentName')?.value.trim()||'',
          parentPhone:document.getElementById(cardId+'_eParentPhone')?.value.trim()||''}
        :null)
    };
    let res=(await callFn('runnerAction')(callPayload)).data;
    // 改了姓名、性別、生日或身分證：確認是同一人修改資料（不能換人）
    if(res.status==='confirm-identity-change'){
      if(!(await confirmIdentityChange(res.fields||[],''))) return;
      res=(await callFn('runnerAction')({...callPayload,confirmIdentityChange:true})).data;
    }
    // 憑證與快取更新（姓名/性別/生日可能被改了，之後的動作要用新值驗證）
    statusCred=res.updatedCredentials||statusCred;
    const cached=statusCache[entryDocId];
    if(cached){
      Object.assign(cached.profile,{name,gender,birthday,phone,email,idNumber,note});
      const groupName=document.getElementById(cardId+'_eGroup')?.selectedOptions?.[0]?.textContent||cached.entry.group;
      Object.assign(cached.entry,{group:groupName,groupId,customData,memberNo:memberNo.normalize('NFKC').replace(/[\s/]+/g,'').toUpperCase(),bibNumber:res.newBib||cached.entry.bibNumber});
      // 卡片上的報名資訊是查詢當下一次性畫好的，存檔成功後要手動重畫，
      // 不然畫面（含 QR Code 裡的編號）看起來會像沒改到（資料庫其實已經改好了）
      renderStatusInfo(cardId, entryDocId);
      // 編號真的有變動的話，「查看可用號碼」的快取要清掉，不然剛用掉/剛空出來的號碼要重整頁面才會反映
    }
    showToast('已儲存修改');
    document.getElementById(cardId+'_edit').innerHTML='<div class="csv-hint">✅ 修改已儲存</div>';
  }catch(err){
    showToast('儲存失敗：'+err.message,'error');
  }
}
