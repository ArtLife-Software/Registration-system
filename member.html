window.onLookupAllEventsChange=function(){
  const isAll=document.getElementById('lookupAllEvents').checked;
  document.getElementById('lookupEventRow').style.display=isAll?'none':'block';
}
window.doLookup=async function(){
  const isAll=document.getElementById('lookupAllEvents').checked;
  const eventId=document.getElementById('lookupEventSelect').value;
  const uid=document.getElementById('lookupId').value.trim();
  const idNum=document.getElementById('lookupIdNum').value.trim();
  const birthday=document.getElementById('lookupBirthday').value.trim();
  const result=document.getElementById('lookupResult');
  if(!birthday){showToast('請填寫生日','error');return;}
  if(!validateBirthday(birthday)){showToast('生日格式錯誤（yyyy/mm/dd）','error');return;}
  if(!uid&&!idNum){showToast('請輸入 ID 或身分證字號（擇一）','error');return;}
  if(!isAll&&!eventId){showToast('請先選擇活動','error');return;}
  result.innerHTML='<div class="card"><div class="loading-cell">查詢中...</div></div>';
  awardStore.length=0;

  // 身分比對由 Cloud Function（runnerLookup）在伺服器端處理：
  // 參加者主檔（含個資）不開放讀取，伺服器驗證「(ID 或身分證) + 生日」
  // 相符後，只回傳報名記錄的基本資料（姓名/編號/組別/是否申請取消中/是否在獎狀頒發名單上）。
  let res;
  try{
    res=(await callFn('runnerLookup')({
      eventId:isAll?'all':eventId, uid, idNumber:idNum, birthday
    })).data;
  }catch(err){
    result.innerHTML='<div class="card"><div class="loading-cell" style="color:var(--red)">查詢失敗：'+esc(err.message)+'</div></div>';
    return;
  }
  const matched=res.matched||[];
  if(!matched.length){result.innerHTML='<div class="card"><div class="loading-cell" style="color:var(--red)">查無資料，請確認填寫的資料是否正確</div></div>';return;}

  // 依活動分組（同一場找到多筆時，提示同時輸入 ID 和身分證）
  const byEvent=new Map();
  matched.forEach(m=>{
    if(!byEvent.has(m.eventId))byEvent.set(m.eventId,{evName:m.evName,evDate:m.evDate,evOrganizer:m.evOrganizer,items:[]});
    byEvent.get(m.eventId).items.push(m);
  });
  let html='';
  for(const [evId,grp] of byEvent){
    if(grp.items.length>1){
      html+='<div class="card"><div style="font-size:.85rem;color:var(--muted)">'+esc(grp.evName)+'（'+esc(grp.evDate||'日期不詳')+'）</div><div style="color:var(--accent);font-size:.85rem;margin-top:4px">找到多筆符合資料，請同時輸入 ID 和身分證字號</div></div>';
      continue;
    }
    html+=await buildLookupCard(grp.items[0].entry, evId, {name:grp.evName,date:grp.evDate,organizer:grp.evOrganizer});
  }
  result.innerHTML=html;
}

// 組別距離的顯示文字。unit：'km' 公里、'K'、'm' 公尺、'mi' 英里
function groupDistText(d, unit) {
  d = parseFloat(d); if (!(d > 0)) return '';
  const n = String(Math.round(d * 10000) / 10000);
  return unit === 'K' ? n + 'K' : unit === 'm' ? n + ' 公尺' : unit === 'mi' ? n + ' 英里' : n + ' 公里';
}

  'letter-landscape': { w: 279.4, h: 215.9, label: 'Letter 橫式' },
  'letter-portrait':  { w: 215.9, h: 279.4, label: 'Letter 直式' },
};
const CERT_DPI = 150;
function certPaper(tpl) {
  const bg = (tpl && tpl.bg) || {};
  if (bg.size === 'custom' && bg.pw > 0 && bg.ph > 0) return { w: +bg.pw, h: +bg.ph };
  return CERT_PAPERS[bg.size] || CERT_PAPERS['a4-landscape'];
}
// 依底圖比例猜紙張：接近 √2 → A4（A、B 系列比例相同，無法分辨，預設 A4）；接近 Letter → Letter；其他 → 自訂（長邊 297mm）
function certGuessPaper(wPx, hPx) {
  const land = wPx >= hPx, r = Math.max(wPx, hPx) / Math.min(wPx, hPx);
  if (Math.abs(r - Math.SQRT2) < 0.02) return { size: land ? 'a4-landscape' : 'a4-portrait' };
  if (Math.abs(r - 279.4 / 215.9) < 0.02) return { size: land ? 'letter-landscape' : 'letter-portrait' };
  const long = 297, short = Math.round(long / r * 10) / 10;
  return { size: 'custom', pw: land ? long : short, ph: land ? short : long, lock: true };
}

function certFontCssUrl(family) {
  const f = CERT_FONTS_ZH.concat(CERT_FONTS_EN).find((x) => x.id === family);
  const name = encodeURIComponent(family).replace(/%20/g, '+');
  const w = f && f.weights.length > 1 ? ':wght@' + f.weights.join(';') : '';
  return 'https://fonts.googleapis.com/css2?family=' + name + w + '&display=swap';
}
const _certFontCss = {};
function certEnsureFontCss(family) {
  if (!family) return Promise.resolve();
  if (_certFontCss[family]) return _certFontCss[family];
  _certFontCss[family] = new Promise((resolve) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = (window.CERT_FONT_CSS_OVERRIDE ? window.CERT_FONT_CSS_OVERRIDE(family) : certFontCssUrl(family));
    link.onload = () => resolve();
    link.onerror = () => resolve(); // 載入失敗就用備用字型畫，不要整張獎狀卡住
    document.head.appendChild(link);
  });
  return _certFontCss[family];
}
function certFontString(b, px) {
  const fams = [];
  if (b.fontEn) fams.push('"' + b.fontEn + '"');
  fams.push('"' + (b.fontZh || 'Noto Sans TC') + '"');
  fams.push('sans-serif');
  return (b.weight || 400) + ' ' + px + 'px ' + fams.join(', ');
}
// 確保每個文字方塊「實際要畫的字」都已下載好；字型沒好就畫，會變成系統預設字型而且每次結果不一樣
async function certEnsureFonts(tpl, data) {
  const boxes = (tpl && tpl.boxes) || [];
  const fams = new Set();
  boxes.forEach((b) => { if (b.fontZh) fams.add(b.fontZh); if (b.fontEn) fams.add(b.fontEn); });
  await Promise.all([...fams].map(certEnsureFontCss));
  if (!document.fonts || !document.fonts.load) return;
  const jobs = boxes.map((b) => {
    const r = certResolveText(b, data);
    if (r.hidden || !r.text.trim()) return null;
    return document.fonts.load(certFontString(b, 40), r.text.replace(/\n/g, '')).catch(() => {});
  }).filter(Boolean);
  await Promise.race([Promise.all(jobs), new Promise((r) => setTimeout(r, 10000))]); // 最多等 10 秒
}

// ── 變數代入 ──
// 回傳 {text, hidden}。hide：'' 不隱藏；'*' 內容中任一變數沒有值就隱藏；'變數名' 該變數沒有值就隱藏
function certResolveText(b, data) {
  data = data || {};
  let anyEmpty = false;
  const text = String(b.text || '').replace(/\{([^{}]+)\}/g, (m, k) => {
    if (!CERT_VARS.some((v) => v.key === k)) return m; // 不認得的代碼原樣保留，方便發現打錯字
    const v = data[k];
    if (v === undefined || v === null || String(v) === '') { anyEmpty = true; return ''; }
    return String(v);
  });
  let hidden = false;
  if (b.hide === '*') hidden = anyEmpty;
  else if (b.hide) { const v = data[b.hide]; hidden = v === undefined || v === null || String(v) === ''; }
  return { text, hidden };
}

// ── 換行：中文逐字可斷，英數字整個單字一起換行 ──
// 避頭點：這些標點不能出現在行首，換行時把前一個字一起帶到下一行（中文排版慣例）
const CERT_NO_LINE_START = '，。、；：！？）」』】》〉…—．,.;:!?)]}%';
function certWrapLine(ctx, line, maxW) {
  const tokens = line.match(/[A-Za-z0-9@#$%&*+\-_.,:;!?'"()\/]+|\s+|./gu) || [];
  const out = []; let cur = '';
  for (const t of tokens) {
    const test = cur + t;
    if (cur && ctx.measureText(test).width > maxW) {
      if (CERT_NO_LINE_START.includes(t[0]) && [...cur].length > 1) {
        const chars = [...cur]; const last = chars.pop();
        out.push(chars.join('').replace(/\s+$/, ''));
        cur = last + t;
        continue;
      }
      out.push(cur.replace(/\s+$/, ''));
      cur = /^\s+$/.test(t) ? '' : t;
    } else cur = test;
  }
  if (cur) out.push(cur);
  return out.length ? out : [''];
}

// ── 內建底圖 ──
function certDrawPresetBg(ctx, W, H, preset) {
  const u = Math.min(W, H) / 1240; // 以 A4 短邊 1240 為基準等比例
  if (preset === 'classic') {
    const g = ctx.createRadialGradient(W / 2, 0, 0, W / 2, 0, Math.max(W, H) * 0.8);
    g.addColorStop(0, '#fffaf0'); g.addColorStop(0.6, '#fbf6ea'); g.addColorStop(1, '#f6eedb');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 6 * u;
    certRoundRect(ctx, 32 * u, 32 * u, W - 64 * u, H - 64 * u, 10 * u); ctx.stroke();
    ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2 * u;
    certRoundRect(ctx, 48 * u, 48 * u, W - 96 * u, H - 96 * u, 6 * u); ctx.stroke();
    // 四角小菱形裝飾
    ctx.fillStyle = '#d4af37';
    [[48, 48], [W / u - 48, 48], [48, H / u - 48], [W / u - 48, H / u - 48]].forEach(([x, y]) => {
      ctx.beginPath(); ctx.moveTo(x * u, (y - 10) * u); ctx.lineTo((x + 10) * u, y * u);
      ctx.lineTo(x * u, (y + 10) * u); ctx.lineTo((x - 10) * u, y * u); ctx.closePath(); ctx.fill();
    });
  } else {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#d0d4dc'; ctx.lineWidth = 2 * u;
    ctx.strokeRect(40 * u, 40 * u, W - 80 * u, H - 80 * u);
  }
}
function certRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

// 獎狀像素尺寸（見 CERT_PAPERS 的說明）
function certCanvasSize(tpl, bgImg) {
  const p = certPaper(tpl);
  let w;
  if (tpl.bg && (tpl.bg.type === 'upload' || tpl.bg.type === 'url') && bgImg && bgImg.naturalWidth) w = bgImg.naturalWidth;
  else w = p.w / 25.4 * CERT_DPI;
  let h = w * p.h / p.w;
  const k = Math.min(1, CERT_MAX_SIDE / Math.max(w, h));
  return { w: Math.round(w * k), h: Math.round(h * k) };
}

// 讀取底圖。http(s) 網址要用 crossOrigin 載入，否則畫進 canvas 後就不能存成 PNG
function certLoadImage(src) {
  return new Promise((resolve, reject) => {
    if (!src) { resolve(null); return; }
    const img = new Image();
    if (!/^data:/.test(src)) img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('底圖載入失敗'));
    img.src = src;
  });
}

// ── 主程式：把獎狀畫到 canvas 上（同步；呼叫前先 await certEnsureFonts） ──
// 回傳每個文字方塊在畫布上的範圍（後台拖曳、點選用）
// opts.noBg：不畫底圖、只畫文字（「套印」匯出用；這是匯出當下的選項，不存進設定）
function certDraw(canvas, tpl, data, bgImg, opts) {
  opts = opts || {};
  const { w: W, h: H } = certCanvasSize(tpl, bgImg);
  if (canvas.width !== W) canvas.width = W;
  if (canvas.height !== H) canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  if (opts.noBg) {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  } else if (tpl.bg && tpl.bg.type !== 'preset') {
    // 自訂底圖；還沒上傳或載入失敗時畫白底（不要退回內建底圖，以免誤以為設定沒生效）
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    if (bgImg) ctx.drawImage(bgImg, 0, 0, W, H);
  } else certDrawPresetBg(ctx, W, H, (tpl.bg && tpl.bg.preset) || 'classic');

  const rects = [];
  for (const b of (tpl.boxes || [])) {
    const r = certResolveText(b, data);
    let px = Math.max(1, (Number(b.size) || 2) * W / 100);
    const maxW = (Number(b.width) || 0) * W / 100;
    const x = (Number(b.x) || 0) * W / 100, y = (Number(b.y) || 0) * H / 100;
    ctx.font = certFontString(b, px);
    let lines = r.text.split('\n');
    if (maxW > 0 && b.fit === 'shrink') {
      // 自動縮小：維持不換行，整段縮到放得下為止
      const widest = Math.max(...lines.map((l) => ctx.measureText(l).width), 1);
      if (widest > maxW) { px = px * maxW / widest; ctx.font = certFontString(b, px); }
    } else if (maxW > 0) {
      lines = lines.flatMap((l) => certWrapLine(ctx, l, maxW));
    }
    const lh = px * 1.4;
    const total = lh * lines.length;
    const widths = lines.map((l) => ctx.measureText(l).width);
    const bw = Math.max(maxW > 0 && b.fit !== 'shrink' ? maxW : 0, ...widths, px);
    const x0 = b.align === 'left' ? x : b.align === 'right' ? x - bw : x - bw / 2;
    rects.push({ id: b.id, x0, y0: y - total / 2, x1: x0 + bw, y1: y + total / 2, hidden: r.hidden });
    if (r.hidden) continue;
    ctx.fillStyle = b.color || '#000';
    ctx.textAlign = b.align === 'left' ? 'left' : b.align === 'right' ? 'right' : 'center';
    ctx.textBaseline = 'middle';
    lines.forEach((l, i) => ctx.fillText(l, x, y - total / 2 + lh * (i + 0.5)));
  }
  return rects;
}

// ── 參加者資料 → 變數值 ──
// info：{name,bibNumber,uniqueId,group,distanceText,checkins,entrants,eventName,eventDate,organizer}
function certBuildData(info) {
  const s = (v) => (v === undefined || v === null ? '' : String(v));
  return {
    '姓名': s(info.name), '編號': s(info.bibNumber), 'ID': s(info.uniqueId), '組別': s(info.group),
    '組別距離': s(info.distanceText), '組別報到人數': s(info.checkins), '組別報名人數': s(info.entrants),
    '活動名稱': s(info.eventName), '活動日期': s(info.eventDate), '主辦單位': s(info.organizer),
  };
}

// ════════════════════════════
// 獎狀（參加者端）
// ════════════════════════════
// 版面與「開放下載」開關來自後台設定（events/{id}/settings/award）；沒設定過＝不開放下載。
// 誰有獎狀由後台的「頒發名單」勾選決定（報名記錄的 award 欄位，由 runnerLookup 驗證身分後回傳）。
let awardStore=[]; // 查詢結果中可產生獎狀的報名紀錄，供「產生獎狀」按鈕使用
const awardSettingsCache={};
function loadAwardSettings(eventId){
  if(!awardSettingsCache[eventId]){
    awardSettingsCache[eventId]=(async()=>{
      let c=null;
      try{ const snap=await getDoc(doc(db,'systems',SYS,'events',eventId,'settings',CERT_KINDS.award.settings)); c=snap.exists()?snap.data():null; }catch(e){}
      return { open: !!(c && c.open), template: (c && c.template) || certDefaultTemplate('award') };
    })();
  }
  return awardSettingsCache[eventId];
}
const awardBgCache={};
function loadAwardBg(eventId, tpl){
  const bg=tpl.bg||{};
  if(bg.type==='preset') return Promise.resolve(null);
  const key=eventId+'|'+bg.type+'|'+(bg.url||'');
  if(!awardBgCache[key]){
    awardBgCache[key]=(async()=>{
      try{
        if(bg.type==='upload'){
          const snap=await getDoc(doc(db,'systems',SYS,'events',eventId,'settings',CERT_KINDS.award.bg));
          return snap.exists()?await certLoadImage(snap.data().dataUrl):null;
        }
        if(bg.type==='url'&&bg.url) return await certLoadImage(bg.url);
      }catch(e){ console.warn('底圖載入失敗',e); }
      return null;
    })();
  }
  return awardBgCache[key];
}
// 組出獎狀變數要用的資料。組別距離、組別報名／報到人數要另外讀取，版面有用到才讀
async function buildAwardInfo(a, tpl){
  const e=a.entry, ev=a.ev||{};
  const info={ name:e.name||'', bibNumber:e.bibNumber||'', uniqueId:e.uniqueId||'', group:e.group||'',
    distanceText:'', entrants:'', checkins:'', eventName:ev.name||'', eventDate:ev.date||'', organizer:ev.organizer||'' };
  const uses=k=>(tpl.boxes||[]).some(b=>String(b.text||'').includes('{'+k+'}')||b.hide===k);
  if(!e.groupId) return info;
  try{
    if(uses('組別距離')){
      const g=await getDoc(doc(db,'systems',SYS,'events',a.eventId,'groups',e.groupId));
      if(g.exists()) info.distanceText=groupDistText(g.data().distance,g.data().distanceUnit);
    }
    if(uses('組別報名人數')||uses('組別報到人數')){
      const entSnap=await getDocs(query(collection(db,'systems',SYS,'events',a.eventId,'runners'),where('groupId','==',e.groupId)));
      const uids=entSnap.docs.map(d=>d.data().uniqueId).filter(Boolean);
      info.entrants=uids.length;
      if(uses('組別報到人數')){
        const ckSnap=await getDocs(collection(db,'systems',SYS,'events',a.eventId,'checkins'));
        const ck=new Set(ckSnap.docs.map(d=>d.id));
        info.checkins=uids.filter(u=>ck.has(u)).length;
      }
    }
  }catch(err){ console.warn('獎狀資料讀取失敗',err); }
  return info;
}
let curAward=null;
window.openAward=async function(idx){
  const a=awardStore[idx]; if(!a)return;
  curAward=a;
  const cv=document.getElementById('certCanvas'), loading=document.getElementById('certLoading');
  cv.style.display='none'; loading.style.display='block'; loading.textContent='獎狀產生中...';
  document.getElementById('certSaveBtn').disabled=true; document.getElementById('certPrintBtn').disabled=true;
  document.getElementById('certModalOverlay').style.display='flex';
  try{
    const set=await loadAwardSettings(a.eventId);
    const [bgImg,info]=await Promise.all([loadAwardBg(a.eventId,set.template), buildAwardInfo(a,set.template)]);
    const data=certBuildData(info);
    await certEnsureFonts(set.template,data);
    if(curAward!==a) return; // 等待期間使用者已關掉或換了另一張
    certDraw(cv,set.template,data,bgImg);
    loading.style.display='none'; cv.style.display='block';
    document.getElementById('certSaveBtn').disabled=false; document.getElementById('certPrintBtn').disabled=false;
  }catch(e){
    loading.textContent='產生失敗，請稍後再試（'+e.message+'）';
  }
}
window.closeAward=function(){
  curAward=null;
  document.getElementById('certModalOverlay').style.display='none';
}
window.printAward=function(){
  const cv=document.getElementById('certCanvas');
  // 紙張方向跟著獎狀走：橫式印橫式、直式印直式
  let st=document.getElementById('certPrintPageStyle');
  if(!st){ st=document.createElement('style'); st.id='certPrintPageStyle'; document.head.appendChild(st); }
  st.textContent='@media print{@page{size:'+(cv.width>=cv.height?'landscape':'portrait')+';margin:0;}}';
  window.print();
}
window.exportAwardImage=function(){
  const cv=document.getElementById('certCanvas'), e=(curAward&&curAward.entry)||{};
  const filename='獎狀_'+(e.bibNumber||'')+'_'+(e.name||'')+'.png';
  let ok=true;
  try{
    cv.toBlob(blob=>{
      if(!blob){ showToast('圖片產生失敗，請改用列印功能','error'); return; }
      const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
      // 手機（含 LINE、FB 內建瀏覽器）下載常沒反應，改跳出預覽讓使用者長按存圖
      if(isMobile){ showPngPreview(URL.createObjectURL(blob),blob,filename); return; }
      downloadBlob(blob,filename); showToast('已下載');
    },'image/png');
  }catch(err){ ok=false; }
  if(!ok) showToast('無法存成圖片（底圖主機不允許），請改用列印功能或截圖','error');
}

// 初始化第一個分頁（先完成匿名登入再載入資料）
// 先確認報名系統，再載入報名頁
ensureAuth().then(initSystem).then(async ok=>{ if(ok&&!(await redirectIfSimpleEvent())) initSignupPage(); });

// ── 確認網址指定的系統 ──
// 有帶系統代碼：讀出系統名稱顯示在頁首。
// 沒帶代碼：依總後台的設定，列出開放的系統讓人選，或請對方確認網址。
async function initSystem(){
  if(SYS){
    let snap=null;
    if(SYS_RE.test(SYS)) snap=await getDoc(doc(db,'systems',SYS)).catch(()=>null);
    if(snap&&snap.exists()){
      const name=snap.data().name||SYS;
      document.getElementById('sysName').textContent=name;
      document.title=name+'｜參加者服務';
      await applySeriesHeader('參加者服務');
      return true;
    }
    showSysGate('<h3 style="margin-bottom:8px">找不到這個報名系統</h3><p style="color:var(--muted);font-size:.88rem">請確認報名網址是否正確。</p>');
    return false;
  }
  let list=[];
  try{
    const st=await getDoc(doc(db,'platform','settings'));
    if(st.exists()&&st.data().showSystemList===true){
      const snap=await getDocs(query(collection(db,'systems'),where('listed','==',true)));
      list=snap.docs.map(d=>({id:d.id,name:d.data().name||d.id})).sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
    }
  }catch(e){ console.warn('系統清單讀取失敗',e); }
  if(list.length){
    showSysGate('<h3 style="margin-bottom:4px">請選擇報名系統</h3>'
      +list.map(x=>'<a class="sys-pick" href="'+location.pathname+'?s='+encodeURIComponent(x.id)+'">'+esc(x.name)+'</a>').join(''));
  }else{
    showSysGate('<h3 style="margin-bottom:8px">請使用正確的報名網址</h3><p style="color:var(--muted);font-size:.88rem">這個網址沒有指定報名系統，請向主辦單位確認報名網址。</p>');
  }
  return false;
}
function showSysGate(html){
  document.body.classList.add('no-sys');
  const g=document.getElementById('sysGate');
  g.innerHTML=html; g.style.display='block';
}
